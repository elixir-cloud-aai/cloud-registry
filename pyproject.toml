[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py310"]
workers = 1

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cloud_registry"]

[tool.flake8]
exclude = [".git", ".eggs", "build", "venv", ".venv", "env"]
max-line-length = 88
extend-ignore = "E203"

[project]
name ="cloud-registry"
version="0.2.0"
authors = [{name = "ELIXIR Cloud & AAI"}, {email = "alexander.kanitz@alumni.ethz.ch"}]
keywords = [
    "ga4gh", "service", "registry", "elixir", "cloud", "rest", "restful", 
    "api", "app", "server", "openapi", "swagger", "mongodb", "python", "flask"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
description = "GA4GH Service Registry API implementation for the ELIXIR Cloud"
license = "Apache-2.0"
dynamic = ["dependencies"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/elixir-cloud-aai/cloud-registry.git"

[tool.setuptools.packages.find]
include = ["cloud_registry*"]

[tool.setuptools.package-data]
cloud_registry = ["config.yaml", "api/*.yaml"]

[tool.setuptools.dynamic.dependencies]
file = ["requirements.txt"]
