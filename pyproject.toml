[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, Pyflakes, isort, bugbear, pyupgrade, bandit (security),
# logging format
select = ["E", "F", "W", "I", "B", "UP", "S", "G"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["cloud_registry", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
files = ["cloud_registry", "tests"]
warn_unused_ignores = true

# Connexion 2 ships no type information
[[tool.mypy.overrides]]
module = ["connexion", "connexion.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cloud_registry"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[project]
name ="cloud-registry"
authors = [{name = "ELIXIR Cloud & AAI"}, {email = "alexander.kanitz@alumni.ethz.ch"}]
keywords = [
    "ga4gh", "service", "registry", "elixir", "cloud", "rest", "restful",
    "api", "app", "server", "openapi", "swagger", "mongodb", "python", "flask"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
description = "GA4GH Service Registry API implementation for the ELIXIR Cloud"
license = "Apache-2.0"
dynamic = ["dependencies", "version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/elixir-cloud-aai/cloud-registry.git"

[tool.setuptools_scm]
# Version from Git tags (`vX.Y.Z`), the only place it is stored; builds
# without Git metadata (e.g., Docker builds, which get no `.git`) report the
# fallback unless `SETUPTOOLS_SCM_PRETEND_VERSION` is set. See "Versioning
# and releases" in README.md
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
include = ["cloud_registry*"]

[tool.setuptools.package-data]
cloud_registry = ["config.yaml", "api/*.yaml", "access_control/*.conf"]

[tool.setuptools.dynamic.dependencies]
file = ["requirements.txt"]
