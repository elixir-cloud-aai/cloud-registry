# Config overlay for local development with Docker Compose; NOT for
# deployments, which must set the audience and an admin group instead (see
# `deployment/README.md`)
security:
    auth:
        # Accept LS Login tokens for any audience (i.e., of any app)
        verify_audience: False
    access_control:
        # No admin groups (cf. `custom.access_control.require_admin`). Set,
        # but empty, as FOCA warns that `keep_group_subjects` has no effect
        # without a mapping (roles of groups apply either way)
        group_mapping: {}
custom:
    access_control:
        # Start without admin groups (nobody can manage services they don't
        # own)
        require_admin: False
    endpoints:
        # Public URL of the app as published by `docker-compose.yaml`, e.g.,
        # for `Location` headers
        service:
            url_prefix: http
            external_host: localhost
            external_port: 8080
        # Also accept `http` service URLs, e.g., of services running locally
        services:
            url_schemes:
                - http
                - https
