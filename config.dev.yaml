# Config overlay for local development with Docker Compose; NOT for
# deployments, which must set their identity provider, audience, group claim
# and admin group instead (see `docs/configuration.md`)
security:
    auth:
        # A fictitious identity provider, as the app refuses to start without
        # trusted issuers; set your identity provider in `config.local.yaml`
        # to test requests with tokens
        issuers:
          - https://login.example.org/oidc/
        # Accept tokens for any audience (i.e., of any app)
        verify_audience: False
    access_control:
        # Start without admin groups (nobody can manage services they don't
        # own)
        require_admin: False
        # The claim with the groups of users, for roles of groups (an
        # example; set that of your identity provider in `config.local.yaml`)
        claim_groups: groups
        # No admin groups. Set, but empty, as FOCA warns that
        # `keep_group_subjects` has no effect without a mapping (roles of
        # groups apply either way)
        group_mapping: {}
        # No admin mode, as no group is mapped to `admin` (FOCA would warn
        # that nobody can opt in to it)
        opt_in_roles: []
server:
    # Public URL of the app as published by `docker-compose.yaml`, e.g., for
    # `Location` headers
    public_url: http://localhost:8080
custom:
    endpoints:
        # Also accept `http` service URLs, e.g., of services running locally
        services:
            url_schemes:
                - http
                - https
