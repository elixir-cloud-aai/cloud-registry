version: '3.6'
services:

    cloud-registry:
        image: elixircloud/cloud-registry:0.1.0
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        links:
            - mongodb
        ports:
            - "8080:8080"

    mongodb:
        # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13
        # (https://jira.mongodb.org/browse/SERVER-121912)
        image: mongo:7.0
        restart: unless-stopped
        volumes:
            - ../data/cloud-registry/db:/data/db
        ports:
            - "27017:27017"
