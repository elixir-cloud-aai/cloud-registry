services:

    cloud-registry:
        image: cloud-registry:local
        # Always build locally instead of pulling an image of that name
        pull_policy: build
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            mongodb:
                condition: service_healthy
        ports:
            - "8080:8080"
        # Development settings (`config.dev.yaml`): tokens for any audience,
        # no admin groups required
        environment:
            FOCA_CONFIG_OVERLAY: /etc/cloud-registry/config.dev.yaml
        volumes:
            - ./config.dev.yaml:/etc/cloud-registry/config.dev.yaml:ro

    # Port 27017 is reachable from the app only; to connect from the host,
    # add `ports: ["127.0.0.1:27017:27017"]` in a `docker-compose.override.yaml`
    mongodb:
        # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13
        # (https://jira.mongodb.org/browse/SERVER-121912)
        image: mongo:7.0
        restart: unless-stopped
        volumes:
            - mongodb-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

volumes:
    mongodb-data:
