version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # connexion 3 needs a FOCA upgrade
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
    groups:
      # Requirements of the documentation (`requirements_docs.txt`), in
      # pull requests of their own
      docs-dependencies:
        patterns: ["mkdocs", "mkdocs-*", "mkdocstrings", "mkdocstrings-*"]
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: [
          "connexion", "foca",
          "mkdocs", "mkdocs-*", "mkdocstrings", "mkdocstrings-*",
        ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # Base image in the `Dockerfile` (tag and digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
