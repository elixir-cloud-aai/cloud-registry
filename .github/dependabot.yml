version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # connexion 3 needs a FOCA upgrade
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
    groups:
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["connexion", "foca"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
