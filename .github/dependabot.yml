version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # connexion 3 needs a FOCA upgrade
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
    groups:
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["connexion", "foca"]
  # Requirements of the code documentation (Read the Docs)
  - package-ecosystem: pip
    directory: /docs/api
    schedule:
      interval: monthly
    groups:
      docs-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # Base image in the `Dockerfile` (tag and digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # FOCA minors are bumped by hand, in the base image and the `foca` pin
      # in `requirements.txt` together (a new base image alone would get the
      # old FOCA reinstalled on top)
      - dependency-name: elixircloud/foca
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
