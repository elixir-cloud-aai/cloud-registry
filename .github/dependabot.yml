version: 2
# Every entry targets `dev` (`target-branch`), which takes all pull
# requests whatever the default branch is (`main` only moves forward to
# releases); security updates always target the default branch, though
updates:
  # Dependencies in `pyproject.toml` and the lock (`uv.lock`), updated
  # together; the image build installs the locked ones (`Dockerfile`),
  # including the build requirements (dependency group `build-system`)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    versioning-strategy: increase-if-necessary
    ignore:
      # connexion 3 needs a FOCA upgrade
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
      # FOCA is bumped by hand, together with the base image (see the `docker`
      # entry): the image build fails unless the base image has the locked
      # FOCA, so separate pull requests of this entry and the `docker` entry
      # would each fail
      - dependency-name: foca
    groups:
      # Dependencies of the documentation (the `docs` extra), in pull
      # requests of their own
      docs-dependencies:
        patterns: [
          "griffelib", "mkdocs", "mkdocs-*", "mkdocstrings",
          "mkdocstrings-*", "pymdown-extensions",
        ]
      # Dependencies match the first group listed
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["connexion", "foca"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github` (to the commits of its releases,
  # `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Images in the `Dockerfile`, the base image and uv (tag and digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      # FOCA is bumped by hand, in the base image and the `foca` requirement
      # in `pyproject.toml` and `uv.lock` together (the image build fails
      # unless the base image has the locked FOCA; see the `uv` entry)
      - dependency-name: elixircloud/foca
    groups:
      docker:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      pre-commit:
        patterns: ["*"]
