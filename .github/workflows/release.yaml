# Release when a version tag (`vX.Y.Z`, or `vX.Y.ZaN`, `vX.Y.ZbN`,
# `vX.Y.ZrcN` for pre-releases) is pushed: check the tag, package the Helm
# chart, build, check and push the Docker image, and create the GitHub
# release with the chart attached. The tag is the only source of the version:
# it is passed to the image build (the Docker build gets no Git metadata) and
# set as the chart's `version` and `appVersion`. Publishing runs in the
# `release` environment (required reviewer, Docker Hub secrets). Release tags
# are immutable (tag ruleset). See "Versioning and releases" in README.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag, so that a run waiting for approval is not cancelled by
# the run of another tag; `latest` is decided at the end of each run, from
# freshly fetched tags on `main`
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check tag and package chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and all tags, to check that the release commit is on
          # `main`
          fetch-depth: 0
      - name: Check release tag and commit
        id: version
        # Guards against accidental releases, e.g., of unmerged commits; the
        # `release` environment's protection rules (required reviewer) are
        # what actually control publishing
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Canonical versions only (no leading zeros), as setuptools-scm
          # would normalize them
          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$ ]]; then
              echo "::error::Tag '${TAG}' is not a release version (e.g., v1.2.3 or v1.2.3rc1)"
              exit 1
          fi
          base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          pre="${BASH_REMATCH[4]}"
          # Annotated, with a signature that GitHub verified
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
              echo "::error::Tag '${TAG}' is not annotated (git tag -s)"
              exit 1
          fi
          verified="$(gh api "repos/${REPOSITORY}/git/tags/$(git rev-parse "refs/tags/${TAG}")" \
              --jq .verification.verified)"
          if [[ "${verified}" != "true" ]]; then
              echo "::error::Tag '${TAG}' has no signature verified by GitHub (git tag -s)"
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit is not on 'main'"
              exit 1
          fi
          {
              echo "version=${TAG#v}"
              echo "sha=$(git rev-parse HEAD)"
              # Charts need SemVer: `1.2.3rc1` becomes `1.2.3-rc1`
              echo "chart_version=${base}${pre:+-${pre}}"
              if [[ -n "${pre}" ]]; then
                  echo "prerelease=true"
              else
                  echo "prerelease=false"
              fi
          } >> "${GITHUB_OUTPUT}"
      # Helm is preinstalled on GitHub-hosted Ubuntu runners; `appVersion`
      # (the default image tag) is the release version
      - name: Package chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          helm lint deployment --strict -f deployment/ci/test-values.yaml
          helm package deployment \
              --version "${CHART_VERSION}" --app-version "${VERSION}" -d dist
          ls "dist/cloud-registry-${CHART_VERSION}.tgz"
      - name: Upload chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish image and release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the GitHub release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The commit checked by `prepare`; release tags cannot be moved (tag
      # ruleset)
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          # All tags and `main`, to determine the highest release
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Tag `X.Y.Z`; OCI labels with the version, commit and source
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_ORG }}/cloud-registry
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
      # Built once and loaded; the checked image is the one that is pushed
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          # Single image, as pushed with `docker push` (no attestations)
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.prepare.outputs.version }}
      - name: Check app version of image
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          actual="$(docker run --rm --entrypoint python "${IMAGE}" \
              -c "from importlib.metadata import version; print(version('cloud-registry'))")"
          if [[ "${actual}" != "${VERSION}" ]]; then
              echo "::error::Image reports version '${actual}', expected '${VERSION}'"
              exit 1
          fi
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: docker push "${IMAGE}"
      - name: Download chart
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: dist/
      # Decided last, from freshly fetched tags (the repository is public, so
      # no credentials are needed), so that neither a re-run of an older
      # release nor a concurrent release moves `latest` back
      - name: Check whether this is the highest release
        id: latest
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          git fetch --quiet --force --tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
          # Stable releases on `main` only, so that stray tags are ignored
          highest="$(git tag -l 'v*' --merged origin/main --sort=-v:refname \
              | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | head -n 1 || true)"
          if [[ "${PRERELEASE}" == "false" && "${highest}" == "${TAG}" ]]; then
              echo "latest=true" >> "${GITHUB_OUTPUT}"
          else
              echo "latest=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Push image as latest
        if: steps.latest.outputs.latest == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          docker tag "${IMAGE}" "${IMAGE%:*}:latest"
          docker push "${IMAGE%:*}:latest"
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.latest.outputs.latest }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # On reruns, complete an existing release instead of failing
          if gh release view "${TAG}" > /dev/null 2>&1; then
              gh release upload "${TAG}" dist/* --clobber
              gh release edit "${TAG}" --latest="${LATEST}"
              exit 0
          fi
          gh release create "${TAG}" dist/* \
              --verify-tag \
              --title "${TAG}" \
              --generate-notes \
              --prerelease="${PRERELEASE}" \
              --latest="${LATEST}"
