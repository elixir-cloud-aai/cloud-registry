# Release when a version tag (`vX.Y.Z`) is pushed: check the tag, package
# the Helm chart, build and push the Docker image, and create the GitHub
# release with the chart attached. The tag is the only source of the version:
# it is passed to the image build (the Docker build gets no Git metadata) and
# set as the chart's `version` and `appVersion`. Publishing runs in the
# `release` environment (required reviewer, Docker Hub secrets). See
# "Versioning and releases" in README.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, so that their images (`latest`) and GitHub releases
# do not interfere
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check tag and package chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and all tags, to check that the release commit is on
          # `main` and whether this is the highest release
          fetch-depth: 0
      - name: Check release tag and commit
        id: version
        # Guards against accidental releases, e.g., of unmerged commits; the
        # `release` environment's protection rules (required reviewer) are
        # what actually control publishing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '${TAG}' is not a release version (vX.Y.Z)"
              exit 1
          fi
          # Signatures are not verified here (that needs the signer's key),
          # only that the tag is annotated and signed
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]] \
              || ! git cat-file -p "refs/tags/${TAG}" \
                  | grep -qE '^-----BEGIN (PGP|SSH) SIGNATURE-----$'; then
              echo "::error::Tag '${TAG}' is not signed (git tag -s)"
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit is not on 'main'"
              exit 1
          fi
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
          # `latest` only for the highest release, e.g., not for a patch
          # release of an older minor version
          highest="$(git tag -l 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [[ "${highest}" == "${TAG}" ]]; then
              echo "latest=true" >> "${GITHUB_OUTPUT}"
          else
              echo "latest=false" >> "${GITHUB_OUTPUT}"
          fi
      # Helm is preinstalled on GitHub-hosted Ubuntu runners; chart and app
      # versions are the same (`appVersion` is the default image tag)
      - name: Package chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm lint deployment --strict -f deployment/ci/test-values.yaml
          helm package deployment \
              --version "${VERSION}" --app-version "${VERSION}" -d dist
          ls "dist/cloud-registry-${VERSION}.tgz"
      - name: Upload chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish image and release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tags `X.Y.Z`, plus `latest` for the highest release; OCI labels with
      # the version, commit and source
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_ORG }}/cloud-registry
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.prepare.outputs.version }}
      - name: Download chart
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: dist/
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          # On reruns, complete an existing release instead of failing
          if gh release view "${TAG}" > /dev/null 2>&1; then
              gh release upload "${TAG}" dist/* --clobber
              exit 0
          fi
          gh release create "${TAG}" dist/* \
              --verify-tag \
              --title "${TAG}" \
              --generate-notes \
              --latest="${LATEST}"
