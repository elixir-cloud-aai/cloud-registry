# Scan the image of the latest release (`latest`) weekly for known
# vulnerabilities with Trivy, as the `scan` job of `checks.yaml` scans the
# images of pull requests and pushes, so that vulnerabilities found after a
# release are reported: all findings are uploaded to code scanning, and the
# workflow fails on critical and high vulnerabilities that have a fix (fixed
# by a new release). Accepted findings are listed in `.trivyignore.yaml` (on
# `dev`). The image is public, so no Docker Hub secrets are needed; its name
# is the one documented in `docs/development.md`.

name: Scan release image

on:
  schedule:
    # Mondays, 05:17 UTC
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan release image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan image
        uses: ./.github/actions/scan-image
        with:
          image: docker.io/elixircloud/cloud-registry:latest
          category: release-image
