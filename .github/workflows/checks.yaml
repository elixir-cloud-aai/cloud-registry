# This workflow will build the project, lint, run tests, and build and push
# Docker images. For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build app
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze_code:
    name: Static code analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy checks imports, so runtime dependencies are needed too
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters, type checks and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all
      - name: Build distributions
        run: python -m build
      - name: Check wheel contents
        run: |
          unzip -Z1 dist/*.whl | tee wheel-contents.txt
          if grep -Ev '^cloud_registry(/|-[^/]+\.dist-info/)' wheel-contents.txt; then
            echo "::error::Unexpected files in wheel"
            exit 1
          fi
          grep -qx 'cloud_registry/config.yaml' wheel-contents.txt
          grep -Eqx 'cloud_registry-[^/]+\.dist-info/licenses/LICENSE' wheel-contents.txt
          grep -q '^cloud_registry/api/.*\.yaml$' wheel-contents.txt
  test:
    name: Run tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12: Python version of the base image in the Dockerfile
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      - name: Calculate unit test coverage
        run: |
          coverage run --source cloud_registry,scripts -m pytest -W ignore::DeprecationWarning
          coverage xml
      # Upload errors fail the workflow only on pushes, because pull requests
      # from forks and Dependabot get no access to the Codecov token
      - name: Submit Report to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          verbose: true
  # Stable check name for branch protection, independent of the matrix
  tests_passed:
    name: Run tests
    runs-on: ubuntu-latest
    if: always()
    needs: [test]
    steps:
      - name: Check that all test jobs passed
        run: test "${{ needs.test.result }}" = "success"
  helm:
    name: Check Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[dev]"
      # Same Helm version as in `release.yaml`
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Lint chart
        run: |
          helm lint deployment --strict -f deployment/ci/test-values.yaml
          helm lint deployment --strict -f deployment/ci/test-values.yaml \
            --set mongodb.auth.enabled=false --set mongodb.auth.existingSecret=
      # Fails instead of skipping the chart tests if helm is missing
      - name: Test chart
        run: |
          helm version
          pytest tests/test_config.py tests/test_chart.py
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -e ".[docs]"
      # Fails on warnings, e.g., of broken links, anchors and references
      - name: Build documentation
        run: mkdocs build --strict
  smoke_test:
    name: Run app with Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROBE_ENDPOINT: http://localhost:8080/ga4gh/registry/v1/ui/
      # Passed to the image build by Docker Compose, as the workflows do
      SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0+compose
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start app
        # Waits until the containers are healthy (see their health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check that app responds
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --header 'Accept: application/json' "${PROBE_ENDPOINT}"
      # The tests use mongomock, so check database-backed endpoints against
      # MongoDB here. Writes need tokens of the trusted issuer (LS Login), so
      # a verified service is inserted into the database directly
      - name: Check API with MongoDB
        run: |
          docker compose exec -T mongodb mongosh --quiet serviceStore --eval '
            db.services.insertOne({
              id: "SMOKE1",
              name: "Smoke test",
              type: {group: "org.ga4gh", artifact: "tes", version: "1.1.0"},
              organization: {name: "Example", url: "https://example.org"},
              version: "1.0.0",
              url: "https://tes.example.org/ga4gh/tes/v1",
              _verifiedAt: ISODate("2026-10-20T12:34:56.789Z")
            })'
          api="${PROBE_ENDPOINT%/ui/}"
          body="${RUNNER_TEMP}/body.json"
          # Request a path; check the status and that the JSON body matches
          # a jq filter
          check() {
            local method="$1" path="$2" status="$3" filter="$4" actual
            actual="$(curl --silent --show-error --output "${body}" \
              --write-out '%{http_code}' -X "${method}" \
              --header 'Accept: application/json' "${api}${path}")"
            if [ "${actual}" != "${status}" ] \
                || ! jq -e "${filter}" "${body}" > /dev/null; then
              echo "::error::${method} ${path}: status ${actual}, expected ${status} and ${filter}"
              cat "${body}"
              return 1
            fi
          }
          verified_at='"2026-10-20T12:34:56.789Z"'
          check GET /services 200 \
            'map(.id) == ["SMOKE1"] and (.[0] | has("_verifiedAt") or has("_id") | not)'
          check GET /services/SMOKE1 200 '.id == "SMOKE1" and (has("_verifiedAt") | not)'
          check GET /services/types 200 \
            '. == [{"group": "org.ga4gh", "artifact": "tes", "version": "1.1.0"}]'
          check GET /services/SMOKE1/verification 200 ".verified_at == ${verified_at}"
          check GET /verifications 200 \
            "map(.service_id) == [\"SMOKE1\"] and .[0].verified_at == ${verified_at}"
          check GET /services/UNKNWN 404 '.status == 404'
          check GET /service-info 200 '.type.artifact == "service-registry"'
          check POST /services 401 '.status == 401'
          check GET /me 401 '.status == 401'
      - name: Check app version
        run: |
          actual="$(docker compose exec -T cloud-registry python -c \
            "from importlib.metadata import version; print(version('cloud-registry'))")"
          if [ "${actual}" != "${SETUPTOOLS_SCM_PRETEND_VERSION}" ]; then
            echo "::error::App reports version '${actual}', expected '${SETUPTOOLS_SCM_PRETEND_VERSION}'"
            exit 1
          fi
      - name: Check license text in image
        run: |
          docker compose exec -T cloud-registry python -c \
            "from importlib.metadata import distribution; \
            text = distribution('cloud-registry').read_text('licenses/LICENSE'); \
            assert text and 'Apache License' in text, 'LICENSE missing'"
      - name: Show app logs
        if: failure()
        run: docker compose logs
  publish:
    name: Build and publish app image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' }}
    needs: [analyze_code, tests_passed, helm, docs, smoke_test]
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    # Publish one image at a time, and only for the newest commit on the
    # branch, so that an older run cannot overwrite `dev` with older code
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check that commit is still the branch head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote "https://github.com/${REPOSITORY}.git" "${REF}" | cut -f1)
          [ -n "${head}" ] || { echo "::error::Could not look up ${REF}"; exit 1; }
          if [ "${head}" = "${SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping publish: ${REF} has moved on to ${head}"
          fi
      - name: Check out repository
        if: steps.head.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to derive the version
          fetch-depth: 0
      - name: Set up Python
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The Docker build gets no Git metadata, so the version (e.g.,
      # `0.3.1.dev4+g<commit>`) is passed as a build argument
      - name: Derive version
        if: steps.head.outputs.current == 'true'
        id: version
        # Same bound as in `build-system.requires` of `pyproject.toml`
        run: |
          pip install "setuptools-scm>=8"
          echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tags `dev` and `sha-<commit>` (never `latest`, which is for
      # releases); OCI labels with the version, commit and source
      - name: Generate image tags and labels
        if: steps.head.outputs.current == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_ORG }}/cloud-registry
          flavor: latest=false
          tags: |
            type=raw,value=dev
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build and push image
        if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
