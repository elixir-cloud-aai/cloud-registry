# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    # The version is derived from Git tags (setuptools-scm), which shallow
    # clones may lack
    post_checkout:
      - git fetch --unshallow --tags || true

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/api/conf.py
  # Fail on all warnings, e.g., modules that autodoc cannot import
  fail_on_warning: true

# Install the package with its dependencies, so that autodoc can import the
# modules, and the docs requirements
python:
  install:
    - method: pip
      path: .
    - requirements: docs/api/requirements.txt
