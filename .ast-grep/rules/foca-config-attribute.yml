id: foca-config-attribute
language: python
severity: error
message: Untyped access to the FOCA config
note: |
  Use FOCA's `get_custom_config(CustomConfig)` (`foca`), `get_collection()`
  from `cloud_registry.utils` (or `foca.get_config()`). Only direct attribute
  access is detected.
# Scoped to app code: tests may access and change the config of test apps
files:
  - cloud_registry/**
rule:
  pattern: $APP.config.foca
