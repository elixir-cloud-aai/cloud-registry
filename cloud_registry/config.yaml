# FOCA configuration
# Available in app context as attributes of `foca.get_config()`
# Automatically validated via FOCA
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html

# Server configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.ServerConfig
server:
    host: '0.0.0.0'
    port: 8080
    # Debug mode allows executing arbitrary code; only enable it for local
    # development, on a loopback host
    debug: False
    testing: False

# Security configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.SecurityConfig
security:
    auth:
        add_key_to_claims: True
        algorithms:
          - RS256
        allow_expired: False
        # Trusted token issuers (`iss` claim); tokens of other issuers are
        # rejected
        issuers:
          - https://login.aai.lifescience-ri.eu/oidc/
        # Deployments must set `audience`: only tokens of the apps calling the
        # registry are accepted. LS Login sets the `aud` claim to the client
        # ID of the app the user logged in with (e.g., the registry's front
        # end, a portal or a gateway), so set `audience` to their client IDs,
        # e.g.:
        # audience:
        #   - <client ID>
        # LS Login provides group memberships and names via user info only,
        # not in access tokens; group memberships are needed for the admin
        # role (see below), names are shown to owners of services
        userinfo_claims:
          - eduperson_entitlement
          - name
    # Access control: anyone may read, any authenticated user may register
    # services and becomes their owner; owners may update and delete their
    # services and grant other users the roles `owner` or `maintainer`
    # (update only) on them; admins may do everything. Roles on services are
    # managed by the app (see `cloud_registry/ga4gh/registry/permissions.py`).
    # Cf. https://foca.readthedocs.io/en/latest/access-control/
    access_control:
        enabled: True
        enforce: True
        model: access_control/model.conf
        db_name: serviceStore
        collection_name: policy_rules
        claim_groups: eduperson_entitlement
        # Deployments map their admin groups (values of `claim_groups`) to
        # the role `admin`; the app refuses to start without one, unless
        # `custom.access_control.require_admin` is false. E.g., for ELIXIR:
        # group_mapping:
        #   "urn:geant:lifescience-ri.eu:group:elixir:ECP_CLN:ADMIN#aai.lifescience-ri.eu": admin
        # Managed on startup (removed rules are deleted); cannot be changed
        # via the permissions API
        policies:
            # any authenticated user may register services (and becomes
            # their owner)
            - [p, "*", /ga4gh/registry/v1/services, POST]
            # owners may update and delete their services and manage their
            # permissions; maintainers may update them
            - [p, owner, "/ga4gh/registry/v1/services/:id", "(PUT)|(DELETE)"]
            - [p, owner, "/ga4gh/registry/v1/services/:id/permissions", GET]
            - [p, owner, "/ga4gh/registry/v1/services/:id/permissions/:user", "(PUT)|(DELETE)"]
            - [p, maintainer, "/ga4gh/registry/v1/services/:id", PUT]
            # any authenticated user may get their identifier and roles
            - [p, "*", /ga4gh/registry/v1/me, GET]
            # no policy for `/services/:id/verification` (PUT, DELETE):
            # only admins may verify services

# Database configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.DBConfig
db:
    # MongoDB service of Docker Compose; the Helm chart sets the MongoDB
    # Service of the release
    host: mongodb
    port: 27017
    dbs:
        serviceStore:
            collections:
                services:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                        # Services are unique by URL and API type; sparse,
                        # as services registered before have no key until
                        # it's added on startup
                        - keys:
                              _serviceKey: 1
                          options:
                            'unique': True
                            'sparse': True
                # Display names of users with roles on services, per service
                user_names:
                    indexes:
                        - keys:
                              service_id: 1
                              user_id: 1
                          options:
                            'unique': True

# API configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.APIConfig
api:
    specs:
        - path:
            - api/20201108.11d2c12.service-info.yaml
            - api/20201108.e0358db.openapi.yaml
            - api/additions.openapi.yaml
          add_operation_fields:
              x-openapi-router-controller: cloud_registry.ga4gh.registry.server
          add_security_fields:
              x-bearerInfoFunc: foca.security.auth.validate_token
          disable_auth: False
          connexion:
              strict_validation: True
              validate_responses: True
              options:
                  swagger_ui: True
                  serve_spec: True

# Logging configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.LogConfig
log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

exceptions:
    mapping: cloud_registry.exceptions.exceptions

custom:
    # Size limit of request bodies, in bytes (default: 1 MiB); larger requests
    # are rejected with `413 Content Too Large` before authentication and
    # parsing. Raise it together with the limits of any proxies in front of
    # the app (the Helm chart sets the limit of ingress-nginx from it)
    max_content_length: 1048576
    # Refuse to start unless a group is mapped to the role `admin` (see
    # `security.access_control.group_mapping`)
    access_control:
        require_admin: True
    endpoints:
        # Public URL of the app, e.g., for the `Location` header; `api_path` is
        # a path prefix in front of the API base path (e.g., of a reverse
        # proxy)
        service:
            url_prefix: https
            external_host: 0.0.0.0
            external_port: 8080
            api_path: ''
        # Service info served at `/service-info`, according to the GA4GH
        # `Service` schema (checked on startup); `version` defaults to the
        # version of the installed package
        service_info:
            id: "ELIXIR_CLOUD_SERVICE_REGISTRY_1"
            name: "ELIXIR_CLOUD"
            type:
                group: "org.ga4gh"
                artifact: "service-registry"
                version: "1.0.0"
            description: "Service registry for the ELIXIR Cloud network."
            organization:
                name: "ELIXIR Cloud & AAI"
                url: "https://elixir-cloud.dcc.sib.swiss/"
            contactUrl: "https://elixir-cloud.dcc.sib.swiss/"
            documentationUrl: "https://github.com/elixir-cloud-aai/cloud-registry"
            environment: "dev"
            # Optional timestamps (RFC 3339), served only if set, e.g.:
            # createdAt: "2020-11-08T00:00:00Z"
            # updatedAt: "2026-10-20T00:00:00Z"
        services:
            id:
                charset: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
                length: 6
