# FOCA configuration
# Available in app context as attributes of `foca.get_config()`
# Automatically validated via FOCA
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html

# Server configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.ServerConfig
server:
    host: '0.0.0.0'
    port: 8080
    # Debug mode allows executing arbitrary code; only enable it for local
    # development, on a loopback host
    debug: False
    testing: False

# Security configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.SecurityConfig
security:
    auth:
        add_key_to_claims: True
        algorithms:
          - RS256
        allow_expired: False
        # Trusted token issuers (`iss` claim); tokens of other issuers are
        # rejected
        issuers:
          - https://login.aai.lifescience-ri.eu/oidc/
        # Tokens are accepted for any audience, e.g., for local development.
        # Deployments should only accept tokens of the apps calling the
        # registry: LS Login sets the `aud` claim to the client ID of the app
        # the user logged in with (e.g., the registry's front end, a portal
        # or a gateway), so set `audience` to their client IDs and remove
        # `verify_audience`.
        verify_audience: False

# Database configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.DBConfig
db:
    host: mongodb
    port: 27017
    dbs:
        serviceStore:
            collections:
                services:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                service_info:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True

# API configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.APIConfig
api:
    specs:
        - path:
            - api/20201108.11d2c12.service-info.yaml
            - api/20201108.e0358db.openapi.yaml
            - api/additions.openapi.yaml
          add_operation_fields:
              x-openapi-router-controller: ga4gh.registry.server
          add_security_fields:
              x-bearerInfoFunc: app.validate_token
          disable_auth: False
          connexion:
              strict_validation: True
              validate_responses: True
              options:
                  swagger_ui: True
                  serve_spec: True

# Logging configuration
# Cf. https://foca.readthedocs.io/en/latest/modules/foca.models.html#foca.models.config.LogConfig
log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

exceptions:
    mapping: cloud_registry.exceptions.exceptions

custom:
    endpoints:
        service:
            url_prefix: https
            external_host: 0.0.0.0
            external_port: 8080
            api_path: ''
        service_info:
            id: "ELIXIR_CLOUD_SERVICE_REGISTRY_1"
            name: "ELIXIR_CLOUD"
            type:
                group: "org.ga4gh"
                artifact: "service-registry"
                version: "1.0.0"
            description: "Service registry for the ELIXIR Cloud network."
            organization:
                name: "ELIXIR Cloud & AAI"
                url: "https://elixir-cloud.dcc.sib.swiss/"
            contactUrl: "https://elixir-cloud.dcc.sib.swiss/"
            documentationUrl: "https://github.com/elixir-cloud-aai/cloud-registry"
            environment: "dev"
            version: "1.0.0-dev-20201108.e0358db"
        services:
            id:
                charset: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
                length: 6
            meta_version:
                init: 1
                increment: 1
