# FOCA configuration
# Available in app context as attributes of `foca.get_config()`
# Automatically validated via FOCA
# Cf. https://foca.readthedocs.io/en/latest/configuration/

# Server configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/server/
# `host` and `port` apply to the development server
# (`python -m cloud_registry.app`) only: the image serves the app with
# Gunicorn on port 8080 (`--bind`, see FOCA's `foca.gunicorn_config`)
server:
    host: '0.0.0.0'
    port: 8080
    # Debug mode allows executing arbitrary code; only enable it for local
    # development, on a loopback host
    debug: False
    testing: False
    # Size limit of request bodies, in bytes (1 MiB); larger requests (also
    # chunked ones) are rejected with `413 Content Too Large` before
    # authentication and parsing. Raise it together with the limits of any
    # proxies in front of the app (e.g., with the Helm chart, the annotation
    # `nginx.ingress.kubernetes.io/proxy-body-size` for ingress-nginx, whose
    # default is 1 MiB)
    max_content_length: 1048576
    # Public URL of the app as clients see it, including any path prefix of a
    # reverse proxy (e.g., `https://registry.example.org/` or
    # `https://example.org/registry/`), for the `Location` header of new
    # services; required: the app refuses to start without it (deployments
    # set it; the Helm chart from `hostName` or `publicUrl`)
    # public_url: https://registry.example.org/

# Security configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/auth/ and
# https://foca.readthedocs.io/en/latest/configuration/access-control/
security:
    # Lets browser apps on other origins read how long to wait after a `429`
    cors:
        expose_headers:
          - Retry-After
    auth:
        add_key_to_claims: True
        algorithms:
          - RS256
        allow_expired: False
        # Only access tokens as per RFC 9068 (`typ` header `at+jwt`); other
        # tokens of the issuers, such as ID tokens, are rejected
        verify_token_type: True
        # The identity providers, their claims and the groups mapped to roles
        # are deployment configuration, without defaults (see "Deployment
        # configuration" in `docs/configuration.md`). Deployments must set:
        # - `issuers`: the trusted token issuers (`iss` claim); tokens of
        #   other issuers are rejected, and the app refuses to start without
        #   any;
        # - `audience`: the audiences of the apps calling the registry (`aud`
        #   claim, usually the client IDs of its front end, portals or
        #   gateways); FOCA refuses to start without it, unless
        #   `verify_audience` is false.
        # E.g.:
        # issuers:
        #   - https://login.example.org/oidc/
        # audience:
        #   - registry-portal
        issuers: []
        # Claims that the identity provider releases via user info only, not
        # in access tokens, e.g., the group claim (`claim_groups`, needed for
        # the admin role and roles of groups) and `name` (shown to owners of
        # services); none by default. E.g.:
        # userinfo_claims:
        #   - groups
        #   - name
    # Access control: anyone may read (the read operations are public;
    # deployments may require login for them, see "Requiring login for reads"
    # in `docs/access-control.md`), any authenticated user may register
    # services and becomes their owner; owners may update and delete their
    # services and grant other users, or groups they are members of, the
    # roles `owner` or `maintainer` (update only) on them; admins may do
    # everything. Roles on services are managed by the app with FOCA's
    # resource ownership helpers (see
    # `cloud_registry/ga4gh/registry/permissions.py`).
    # Cf. https://foca.readthedocs.io/en/latest/access-control/
    access_control:
        enabled: True
        enforce: True
        model: access_control/model.conf
        db_name: serviceStore
        collection_name: policy_rules
        # Roles on services (`Role` in `api/additions.openapi.yaml`), which
        # FOCA's ownership helpers grant and revoke; groups must not be
        # mapped to them (`group_mapping`), as their members would get the
        # role on all services
        resource_roles:
            - owner
            - maintainer
        # Deployments set the claim with the groups of users (`claim_groups`)
        # and map their admin groups (values of that claim) to the role
        # `admin` (`group_mapping`); the app refuses to start without them,
        # unless `require_admin` is false. E.g.:
        # claim_groups: groups
        # group_mapping:
        #   registry-admins: admin
        # Also use all values of `claim_groups` (prefixed with `group:`) as
        # subjects, so that roles on services granted to groups apply while
        # `group_mapping` is set
        keep_group_subjects: True
        # Refuse to start without admins, i.e., unless a group is mapped to
        # the role `admin` (`group_mapping`) or, without admin mode
        # (`opt_in_roles: []`), a rule of `policies` grants it (FOCA; false:
        # start with a warning)
        require_admin: True
        # Admin mode: the role `admin` applies only to requests that ask for
        # it in the header `opt_in_header` (default: `X-Request-Roles`);
        # without it, admins have the permissions of other users. Only
        # groups can then be admins: configured rules granting `admin` are
        # refused on startup. `[]` lets admins act as admins on every
        # request; see "Admin mode" in `docs/access-control.md`
        opt_in_roles:
            - admin
        # Managed on startup (removed rules are deleted); cannot be changed
        # via the permissions API. Named, so that overlays can change, add or
        # remove single rules by name (`null` removes a rule)
        policies:
            # any authenticated user may register services (and becomes
            # their owner)
            register-services: [p, "*", /ga4gh/registry/v1/services, POST]
            # owners may update and delete their services and manage their
            # permissions; maintainers may update them
            owners-change-services: [p, owner, "/ga4gh/registry/v1/services/:id", "(PUT)|(DELETE)"]
            owners-list-permissions: [p, owner, "/ga4gh/registry/v1/services/:id/permissions", GET]
            # users (namespaced by issuer, with several issuers) and groups
            # may contain slashes; each rule covers only one of them, so
            # overlays can restrict them separately
            owners-change-permissions: [p, owner, "/ga4gh/registry/v1/services/:id/permissions/users/*", "(PUT)|(DELETE)"]
            owners-change-group-permissions: [p, owner, "/ga4gh/registry/v1/services/:id/permissions/groups/*", "(PUT)|(DELETE)"]
            maintainers-update-services: [p, maintainer, "/ga4gh/registry/v1/services/:id", PUT]
            # owners may invite users to their services by link, list the
            # invitations, revoke open ones and remove expired ones; any
            # authenticated user may
            # accept an invitation, which grants them its role
            owners-manage-invitations: [p, owner, "/ga4gh/registry/v1/services/:id/invitations", "(GET)|(POST)"]
            owners-revoke-invitations: [p, owner, "/ga4gh/registry/v1/services/:id/invitations/:invitation", DELETE]
            accept-invitations: [p, "*", /ga4gh/registry/v1/invitations/accept, POST]
            # any authenticated user may have service info fetched, to import
            # it (limited per user: `custom.endpoints.services.service_info`)
            import-service-info: [p, "*", /ga4gh/registry/v1/services/import, POST]
            # any authenticated user may read and dismiss their notifications
            # (filtered by the app)
            list-notifications: [p, "*", /ga4gh/registry/v1/notifications, GET]
            dismiss-notifications: [p, "*", "/ga4gh/registry/v1/notifications/:id", DELETE]
            # owners and maintainers may turn sync of their services with their
            # service info on and off
            owners-sync-services: [p, owner, "/ga4gh/registry/v1/services/:id/sync", "(PUT)|(DELETE)"]
            maintainers-sync-services: [p, maintainer, "/ga4gh/registry/v1/services/:id/sync", "(PUT)|(DELETE)"]
            # any authenticated user may add service types, unless only
            # admins may (`custom.access_control.service_types: controlled`,
            # checked by the app); keep this rule and set that option instead,
            # as users also add types by registering services; no policy for
            # `DELETE`: only admins may remove service types
            add-service-types: [p, "*", /ga4gh/registry/v1/services/types, POST]
            # any authenticated user may list the pending service types and
            # services they may see (`custom.access_control.service_types:
            # moderated`); no policy for `PUT /services/types/approval`: only
            # admins may approve service types
            list-approvals: [p, "*", /ga4gh/registry/v1/approvals, GET]
            # any authenticated user may get their identifier and roles
            get-me: [p, "*", /ga4gh/registry/v1/me, GET]
            # no policy for `/services/:id/verification` (PUT, DELETE):
            # only admins may verify services; nor for
            # `/service-info/listing`: only admins may list the registry
            # among its services

            # Any authenticated user may read: list services, get a service
            # or the service types (`/services/types` matches
            # `/services/:id`), get the verification of a service and list
            # verifications. Only evaluated if a deployment requires login for
            # these reads, which are public otherwise (see "Requiring login
            # for reads" in `docs/access-control.md`)
            list-services: [p, "*", /ga4gh/registry/v1/services, GET]
            get-service: [p, "*", "/ga4gh/registry/v1/services/:id", GET]
            get-service-verification: [p, "*", "/ga4gh/registry/v1/services/:id/verification", GET]
            list-verifications: [p, "*", /ga4gh/registry/v1/verifications, GET]
            get-service-sync: [p, "*", "/ga4gh/registry/v1/services/:id/sync", GET]
            list-syncs: [p, "*", /ga4gh/registry/v1/syncs, GET]

# Database configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/db/
db:
    # MongoDB service of Docker Compose; the Helm chart sets the MongoDB
    # Service of the release
    host: mongodb
    port: 27017
    dbs:
        serviceStore:
            collections:
                services:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                        # Services are unique by URL and API type
                        - keys:
                              _serviceKey: 1
                          options:
                            'unique': True
                        # Services by type, for removals of types (cf.
                        # `DELETE /services/types`)
                        - keys:
                              type.group: 1
                              type.artifact: 1
                              type.version: 1
                        # Pending services, which reads filter by (internal
                        # flag, set while their type is pending)
                        - keys:
                              _pending: 1
                          options:
                            'sparse': True
                        # Services by the user who registered them, for the
                        # limit of services per user (internal field;
                        # counted on startup)
                        - keys:
                              _createdBy: 1
                        # Services with sync by the time of their next attempt
                        # (internal field, cf. `PUT /services/{serviceId}/sync`)
                        - keys:
                              _sync.nextAttemptAt: 1
                          options:
                            'sparse': True
                        # The entry of the registry among its services
                        # (internal flag, cf. `PUT /service-info/listing`)
                        - keys:
                              _selfEntry: 1
                          options:
                            'sparse': True
                # Service types (`GET /services/types`), unique as written
                service_types:
                    indexes:
                        - keys:
                              group: 1
                              artifact: 1
                              version: 1
                          options:
                            'unique': True
                        # Pending types (`GET /approvals`)
                        - keys:
                              pending: 1
                          options:
                            'sparse': True
                        # Types by the user who added them, for the limit of
                        # unused types per user
                        - keys:
                              createdBy: 1
                # Number of services each user registered (`count`), by user
                # identifier (`_id`), for the limit of services per user
                service_counts: {}
                # Fetches of service info per user (`_id`) in the current
                # hour; MongoDB removes old ones (TTL index; a limit counts
                # for an hour, so documents are kept for at most two)
                service_info_fetches:
                    indexes:
                        - keys:
                              windowStart: 1
                          options:
                            'expireAfterSeconds': 7200
                # Dismissed notifications, per audience
                notification_dismissals: {}
                # Display names of users with roles on services, per service
                user_names:
                    indexes:
                        - keys:
                              serviceId: 1
                              userId: 1
                          options:
                            'unique': True
                # Invitations to services, by the hash of their token
                # (unique), and by service, for listing them. MongoDB removes
                # accepted ones when they expire (TTL index, checked about
                # every minute; reads skip them until then), others
                # `custom.access_control.invitations.keep_expired_days` after
                # that: as the setting can change, the app sets that index on
                # startup (cf. `cloud_registry.utils.set_ttl_index()`)
                invitations:
                    indexes:
                        - keys:
                              tokenHash: 1
                          options:
                            'unique': True
                        - keys:
                              serviceId: 1
                              createdAt: 1
                        - keys:
                              expiresAt: 1
                          options:
                            'name': acceptedExpiresAt
                            'expireAfterSeconds': 0
                            'partialFilterExpression':
                                accepted:
                                    '$exists': True
                # Locks of services, so that renames don't interleave with
                # other changes: of renames by identifier (`_id`), of other
                # changes by service (`service`); stale ones are removed or
                # resumed by their start (cf.
                # `cloud_registry.ga4gh.registry.locks`)
                service_locks:
                    indexes:
                        - keys:
                              service: 1
                              startedAt: 1
                          options:
                            'sparse': True
                        - keys:
                              startedAt: 1

# API configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/api/
# Named (`registry`), so that overlays can change it, e.g., patch it (see
# "Requiring login for reads" in `docs/access-control.md`)
api:
    specs:
        registry:
            path:
              - api/20201108.11d2c12.service-info.yaml
              - api/20201108.e0358db.openapi.yaml
              - api/additions.openapi.yaml
            add_operation_fields:
                x-openapi-router-controller: cloud_registry.ga4gh.registry.server
            add_security_fields:
                # FOCA's `validate_token()`, keeping why tokens are rejected
                # for public reads (cf. `check_read_token()`)
                x-bearerInfoFunc: cloud_registry.ga4gh.registry.permissions.validate_bearer_token
            disable_auth: False
            connexion:
                strict_validation: True
                validate_responses: True
                options:
                    swagger_ui: True
                    serve_spec: True

# Service info, served at `GET /service-info` by FOCA, according to the GA4GH
# `Service` schema (validated on startup); `version` defaults to the version
# of the installed package (`package`). Deployments set their own `id`,
# `name`, `description`, `organization`, `contactUrl` and `environment`; `id`
# and `organization` are placeholders with reserved example domains (RFC
# 2606), which the app warns of on startup
# Cf. https://foca.readthedocs.io/en/latest/configuration/service-info/
service_info:
    package: cloud-registry
    # Adds the rules for registrations (`registrationRules`), built from the
    # `custom` config on each request, so that clients can read them; keep
    # it, and don't set `registrationRules` in `service` (the app refuses
    # to start otherwise; see "Registration rules" in `docs/api.md`)
    runtime_fields: cloud_registry.ga4gh.registry.service_info.runtime_fields
    service:
        id: "org.example.cloud-registry"
        name: "Cloud Registry"
        type:
            group: "org.ga4gh"
            artifact: "service-registry"
            version: "1.0.0"
        description: "Registry of GA4GH and other web services."
        organization:
            name: "Example Organization"
            url: "https://example.org"
        documentationUrl: "https://cloud-registry.readthedocs.io/"
        environment: "dev"
        # Optional timestamps (RFC 3339), served only if set, e.g.:
        # createdAt: "2020-11-08T00:00:00Z"
        # updatedAt: "2026-10-20T00:00:00Z"

# Logging configuration
# Cf. https://foca.readthedocs.io/en/latest/configuration/log/
log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

# Exception handling: problem details of exceptions, sent with the media type
# of error responses of the GA4GH specifications (instead of FOCA's default
# `application/problem+json`), also by the app (`cloud_registry.exceptions`)
# Cf. https://foca.readthedocs.io/en/latest/configuration/exceptions/
exceptions:
    mapping: cloud_registry.exceptions.exceptions
    media_type: application/json
    # Requests rejected by Connexion's validation (e.g., of the schema) get
    # the reason as detail (shortened to `max_detail_length`, 500 characters
    # by default); FOCA's default since 0.18, set explicitly, as clients rely
    # on it
    validation_details: True
    # ... and the validator's reason as up to FOCA 0.21, which quotes the
    # rejected values (FOCA 0.22's default names the invalid fields by
    # location and code instead); for now, until the registry names the
    # invalid fields itself (#317)
    validation_reasons: True

custom:
    access_control:
        # Who may add service types (`GET /services/types`): `open`, any
        # authenticated user, explicitly (`POST /services/types`) or by
        # registering a service with a new type; `controlled`, admins only,
        # and services of other users must have a registered type;
        # `moderated`, any authenticated user, but types of other users than
        # admins are pending until an admin approves them, and so are the
        # services that have them (see "Service types" in `docs/api.md`)
        service_types: open
        # How many service types that no service has a user other than an
        # admin may have added, in modes `open` and `moderated` (`409`
        # above; served as `0` in mode `controlled`); `null` for no limit
        # (see "Service types" in `docs/configuration.md`)
        max_unused_service_types: 10
        # How many of the registered services a user other than an admin
        # may have registered (`409` above); `null` for no limit, `0` to
        # let only admins register services (see "Services per user" in
        # `docs/configuration.md`)
        max_services_per_user: 50
        # Invitations to services by link (`POST
        # /services/{serviceId}/invitations`): days after which they expire
        # (accepted ones are deleted then), for how many days expired ones
        # that weren't accepted are kept before they are deleted (0 to 365),
        # and how many a service may have until they expire, open or accepted
        # (`409` above; `null` for no limit; see "Invitations" in
        # `docs/access-control.md`)
        invitations:
            expiry_days: 7
            keep_expired_days: 30
            max_per_service: 20
    endpoints:
        services:
            id:
                charset: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
                length: 6
            # Schemes allowed in service URLs (`url`; `http`, `https`):
            # clients send access tokens to registered services, so `https`
            # only; links (e.g., `documentationUrl`) may be HTTP(S) URLs
            url_schemes:
                - https
            # Values allowed for the environment of services (`environment`):
            # the values that the GA4GH specification suggests; an empty list
            # allows any value. Served in the service info
            # (`registrationRules`), for clients (e.g., UIs) to offer the
            # same values. The app refuses to start unless the list has the
            # environment of the service info (`service_info.service`)
            environments:
                - prod
                - test
                - dev
                - staging
            # Fetching the service info of services (`POST /services/import`,
            # `PUT /services/{serviceId}/sync`; see "Service info import" and
            # "Service info sync" in `docs/configuration.md`): networks that may
            # be fetched from besides public addresses (CIDR notation; none by
            # default, only for networks whose services users may probe), how
            # often each user may have service info fetched per hour (`429`
            # above), whether services can be synced with their service info,
            # and the time between syncs of a service, in hours
            service_info:
                private_networks: []
                fetches_per_hour: 30
                sync: true
                sync_interval_hours: 24
