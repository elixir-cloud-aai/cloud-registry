openapi: 3.0.2
info:
  title: 'ELIXIR Cloud service registry'
  description: |
    Service registry providing information about all deployed service instances
    in the ELIXIR Cloud network for administration, maintenance and service
    discovery purposes. More information on
    [GitHub](https://github.com/elixir-cloud-aai/cloud-registry).
  version: 1.0.0
  license:
    name: 'Apache 2.0'
    url: 'http://www.apache.org/licenses/LICENSE-2.0'
  contact:
    name: 'ELIXIR Cloud & AAI'
    email: 'alexander.kanitz@alumni.ethz.ch'
servers:
  - url: /ga4gh/registry/v1
# Read operations of the GA4GH specifications are public: the security
# requirements set here are merged into them
paths:
  /service-info:
    get:
      security: []
  /services:
    get:
      security: []
    post:
      summary: Register service.
      description: |
        Create a service resource. Services are unique by URL and API type:
        registering a service again returns `409`. Invalid URLs return `400`
        (cf. `ExternalServiceRegister`).
      operationId: postService
      tags:
        - cloud-registry
      requestBody:
        description: Service metadata.
        required: true
        content:
          application/json:
            schema:
              x-body-name: external_service
              $ref: '#/components/schemas/ExternalServiceRegister'
      responses:
        '201':
          $ref: '#/components/responses/ServiceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateService'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /services/types:
    get:
      security: []
  "/services/{serviceId}":
    get:
      security: []
    delete:
      summary: Delete service.
      description: Delete a service resource.
      operationId: deleteService
      tags:
        - cloud-registry
      parameters:
        - name: serviceId
          in: path
          description: Identifier of service to delete.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The service was successfully deleted.
          content:
            application/json:
              schema:
                type: string
                description: Identifier of deleted service.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Register or update service.
      description: |
        Create (`201`) or update (`200`) a service resource. Only admins can
        create services; for others, unknown services (also services deleted
        during the request) return `404`. Services are unique by URL and API
        type: changing them to those of another service returns `409`.
        Invalid URLs return `400` (cf. `ExternalServiceRegister`).
      operationId: putService
      tags:
        - cloud-registry
      parameters:
        - name: serviceId
          in: path
          description: |
            Identifier of service to register/update; `.` and `..` are not
            allowed, as they are path segments of their own in URLs.
          required: true
          schema:
            type: string
            # anything but `.` and `..` (dot segments in URLs)
            pattern: '^(?!\.\.?$)'
      requestBody:
        description: Service metadata.
        required: true
        content:
          application/json:
            schema:
              x-body-name: external_service
              $ref: '#/components/schemas/ExternalServiceRegister'
      responses:
        '200':
          description: The service was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceId'
        '201':
          $ref: '#/components/responses/ServiceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateService'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/permissions":
    get:
      summary: List service permissions.
      description: |
        List the roles granted on a service. Only for owners of the service
        and admins.
      operationId: getServicePermissions
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Roles granted on the service.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/permissions/{userId}":
    put:
      summary: Grant service permission.
      description: |
        Grant a user a role on a service, replacing any other role of the
        user on the service: `owner` (update and delete the service, manage
        its permissions) or `maintainer` (update the service). Only for
        owners of the service and admins. The last owner of a service cannot
        be downgraded (`409`).
      operationId: putServicePermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        description: Role to grant.
        required: true
        content:
          application/json:
            schema:
              x-body-name: permission
              $ref: '#/components/schemas/PermissionRegister'
      responses:
        '200':
          description: The role was granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Revoke service permission.
      description: |
        Revoke the roles of a user on a service. Only for owners of the
        service and admins. The last owner of a service cannot be removed
        (`409`); delete the service instead.
      operationId: deleteServicePermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The roles were revoked.
          content:
            application/json:
              schema:
                type: string
                description: Identifier of the user.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/verification":
    get:
      summary: Get service verification.
      description: |
        Get the verification of a service, i.e., when an admin verified it
        (e.g., checked that it accepts LS Login tokens). Unverified and
        unknown services return `404`. The verification names the URL and
        API type of the service; it is removed when the URL (in any way, as
        written) or API type (`type.group`, `type.artifact`) of the service
        changes.
      operationId: getServiceVerification
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      security: []
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: The service is verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Verify service.
      description: |
        Mark a service as verified by an admin, at the current time; verifying
        a verified service renews its verification. Only for admins. Send
        the URL and API type that were checked (recommended): the service is
        only verified if it still has exactly that URL (as written) and the
        same API type (`type.group`, `type.artifact`, case-insensitive; not
        `type.version`), otherwise `409` is returned and nothing changes.
        Invalid URLs in the body, and bodies that are neither JSON nor empty
        (or `null`), return `400`. Without a body, the service is verified as
        it is registered at the time of the request. The verification is kept when the service is
        updated with the same URL and API type (e.g., a new version), and
        removed when they change, including other spellings of the URL.
      operationId: putServiceVerification
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        description: URL and API type of the service that were checked.
        required: false
        x-body-name: verification
        content:
          application/json:
            schema:
              # requests without a body are validated as `null`
              nullable: true
              $ref: '#/components/schemas/VerificationRegister'
      responses:
        '200':
          description: The service is verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The service has another URL or API type than the one checked;
            nothing was changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove service verification.
      description: |
        Remove the verification of a service. Only for admins. Unverified and
        unknown services return `404`.
      operationId: deleteServiceVerification
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: The verification was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /verifications:
    get:
      summary: List verified services.
      description: |
        List the verified services, sorted by identifier, with their URL and
        API type and the time of their verification. Clients that only use
        verified services list the services (`GET /services`) and keep those
        listed here with the same identifier, URL and API type.
      operationId: getVerifications
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      security: []
      tags:
        - cloud-registry
      responses:
        '200':
          description: Verified services.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceVerification'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      summary: Get the current user.
      description: |
        Get the identifier of the current user, whether they are an admin,
        and their roles on services. Also stores or refreshes the user's
        display name (from the identity provider) for these services, where
        their owners and admins can see it with the roles.
      operationId: getMe
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    ServiceId:
      name: serviceId
      in: path
      description: Identifier of the service.
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      description: |
        Identifier of the user, i.e., the `sub` claim of the user's tokens
        (e.g., `abc123@lifescience-ri.eu` for LS Login).
      required: true
      schema:
        type: string
  responses:
    ServiceCreated:
      description: The service was successfully registered.
      headers:
        Location:
          description: URL of the registered service (`/services/{serviceId}`).
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceId'
    # Errors are returned as `application/problem+json` (RFC 7807). The
    # entries below are merged into the error responses of the GA4GH
    # specification (cf. `api.specs` in `config.yaml`), adding that media type
    BadRequest:
      description: 'Bad request ([RFC 7235](https://tools.ietf.org/html/rfc7235))'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    DuplicateService:
      description: |
        A service with the same URL and API type (`type.group` and
        `type.artifact`, case-insensitive) is registered. URLs are compared
        after normalizing common spellings (e.g., case of schemes and hosts,
        default ports, trailing slashes, queries and fragments; see the
        README). `serviceId` names the registered service; contact its owner
        or an admin.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required:
                  - serviceId
                properties:
                  serviceId:
                    type: string
                    description: Identifier of the registered service.
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ServiceId:
      description: Service identifier.
      type: string
    PermissionRegister:
      description: Role to grant on a service.
      type: object
      required:
        - role
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
    Permission:
      description: Role of a user on a service.
      type: object
      required:
        - user_id
        - role
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: Identifier of the user.
        name:
          type: string
          description: |
            Display name of the user, if known, i.e., if the user has used
            the registry since being granted a role.
        role:
          $ref: '#/components/schemas/Role'
    Me:
      description: The current user.
      type: object
      required:
        - user_id
        - admin
        - services
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: |
            Identifier of the user, i.e., the `sub` claim of their tokens; to
            be granted roles, users give it to owners of services.
        admin:
          type: boolean
          description: Whether the user is an admin.
        services:
          type: array
          description: Roles of the user on services.
          items:
            $ref: '#/components/schemas/ServiceRole'
    ServiceRole:
      description: Role of the current user on a service.
      type: object
      required:
        - service_id
        - role
      additionalProperties: false
      properties:
        service_id:
          type: string
          description: Identifier of the service.
        role:
          $ref: '#/components/schemas/Role'
    VerificationRegister:
      description: URL and API type of a service that an admin checked.
      type: object
      required:
        - url
        - type
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: URL of the service, exactly as registered.
          example: 'https://tes.example.org/ga4gh/tes/v1'
        type:
          $ref: '#/components/schemas/ServiceTypeRegister'
    Verification:
      description: |
        Verification of a service by an admin, with the URL and API type of
        the service.
      type: object
      required:
        - url
        - type
        - verified_at
      additionalProperties: false
      properties:
        url:
          $ref: '#/components/schemas/VerifiedUrl'
        type:
          $ref: '#/components/schemas/ServiceType'
        verified_at:
          $ref: '#/components/schemas/VerifiedAt'
    VerifiedUrl:
      description: URL of the verified service, as registered.
      type: string
      example: 'https://tes.example.org/ga4gh/tes/v1'
    VerifiedAt:
      description: |
        When an admin verified the service (RFC 3339 format, UTC).
      type: string
      format: date-time
      example: '2026-10-20T12:34:56.789Z'
    ServiceVerification:
      description: Verification of a service, with its identifier.
      type: object
      required:
        - service_id
        - url
        - type
        - verified_at
      additionalProperties: false
      properties:
        service_id:
          $ref: '#/components/schemas/ServiceId'
        url:
          $ref: '#/components/schemas/VerifiedUrl'
        type:
          $ref: '#/components/schemas/ServiceType'
        verified_at:
          $ref: '#/components/schemas/VerifiedAt'
    Role:
      description: |
        Role on a service: `owner` (update and delete the service, manage
        its permissions) or `maintainer` (update the service).
      type: string
      enum:
        - owner
        - maintainer
    # Registration schemas (also `VerificationRegister`) limit the length of
    # strings, which the GA4GH schemas do not limit; see the README (API)
    ExternalServiceRegister:
      description: |
        GA4GH service with a URL. URLs (`url`, `organization.url`,
        `contactUrl`, `documentationUrl`) must be HTTP(S) URLs with a host,
        without user info, whitespace, control or format characters (except
        joiners in international host names) or malformed percent-encodings;
        `contactUrl` can also be a `mailto:` URL with email addresses. Others
        return `400`.
      type: object
      required:
        - name
        - type
        - organization
        - version
        - url
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 1024
          description: 'Name of this service. Should be human readable.'
          example: 'My project'
        type:
          $ref: '#/components/schemas/ServiceTypeRegister'
        description:
          type: string
          maxLength: 4096
          description: 'Description of the service. Should be human readable and provide information about the service.'
          example: 'This service provides...'
        organization:
          type: object
          description: 'Organization providing the service'
          required:
            - name
            - url
          properties:
            name:
              type: string
              maxLength: 1024
              description: 'Name of the organization responsible for the service'
              example: 'My organization'
            url:
              type: string
              format: uri
              maxLength: 2048
              description: 'URL of the website of the organization (RFC 3986 format; HTTP(S))'
              example: 'https://example.com'
        contactUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 'URL of the contact for the provider of this service, e.g. a link to a contact form (RFC 3986 format; HTTP(S)), or an email (RFC 2368 format; `mailto:`).'
          example: 'mailto:support@example.com'
        documentationUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 'URL of the documentation of this service (RFC 3986 format; HTTP(S)). This should help someone learn how to use your service, including any specifics required to access data, e.g. authentication.'
          example: 'https://docs.myservice.example.com'
        createdAt:
          type: string
          format: date-time
          description: 'Timestamp describing when the service was first deployed and available (RFC 3339 format)'
          example: '2019-06-04T12:58:19Z'
        updatedAt:
          type: string
          format: date-time
          description: 'Timestamp describing when the service was last updated (RFC 3339 format)'
          example: '2019-06-04T12:58:19Z'
        environment:
          type: string
          maxLength: 256
          description: 'Environment the service is running in. Use this to distinguish between production, development and testing/staging deployments. Suggested values are prod, test, dev, staging. However this is advised and not enforced.'
          example: 'test'
        version:
          type: string
          maxLength: 256
          description: 'Version of the service being described. Semantic versioning is recommended, but other identifiers, such as dates or commit hashes, are also allowed. The version should be changed whenever the service is updated.'
          example: '1.0.0'
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Base URL of the service ([RFC 3986](https://tools.ietf.org/html/rfc3986) format; HTTP(S)).

            For REST API services, this is the URL to which all endpoints should be relative. In particular, services implementing GA4GH specifications defined in OAS format (as per the `type` field) should respond to requests constructed by appending relative paths from the specification to this base URL (e.g. `{url}/service-info`). See [API Server and Base URL](https://swagger.io/docs/specification/api-host-and-base-path/) for more information on specifying base URLs in OAS 3.
          example: 'https://api.example.com/v1'
    ServiceTypeRegister:
      description: 'Type of a GA4GH service'
      type: object
      required:
        - group
        - artifact
        - version
      additionalProperties: false
      properties:
        group:
          type: string
          maxLength: 256
          description: 'Namespace in reverse domain name format. Use `org.ga4gh` for implementations compliant with official GA4GH specifications. For services with custom APIs not standardized by GA4GH, or implementations diverging from official GA4GH specifications, use a different namespace (e.g. your organization''s reverse domain name).'
          example: 'org.ga4gh'
        artifact:
          type: string
          maxLength: 256
          description: 'Name of the API or GA4GH specification implemented. Official GA4GH types should be assigned as part of standards approval process. Custom artifacts are supported.'
          example: 'beacon'
        version:
          type: string
          maxLength: 256
          description: 'Version of the API or specification. GA4GH specifications use semantic versioning.'
          example: '1.0.0'
