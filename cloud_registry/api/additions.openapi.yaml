            default: false
      responses:
        '200':
          description: Invitations to the service.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/invitations/{invitationId}":
    delete:
      summary: Revoke an invitation to a service, or remove an expired one.
      description: |
        Revoke an open invitation to a service, so that it can't be
        accepted, or remove an expired one, so that it is no longer listed.
        Accepted invitations can't be revoked (`409`, `code`:
        `invitation-accepted`); revoke the role instead (`DELETE
        /services/{serviceId}/permissions/users/{userId}`). Only for owners of
        the service and admins.
      operationId: deleteServiceInvitation
      x-openapi-router-controller: cloud_registry.ga4gh.registry.invitations
