openapi: 3.0.2
info:
  title: 'Cloud Registry'
  description: |
    Registry of web services, e.g., of GA4GH APIs, for their discovery,
    administration and maintenance, implementing the GA4GH Service Registry
    API; brought to you by ELIXIR On-Cloud. More information on
    [GitHub](https://github.com/elixir-cloud-aai/cloud-registry).
  version: 1.0.0
  license:
    name: 'Apache 2.0'
    url: 'http://www.apache.org/licenses/LICENSE-2.0'
  contact:
    name: 'ELIXIR On-Cloud'
    email: 'cloud-service@elixir-europe.org'
servers:
  - url: /ga4gh/registry/v1
# Read operations of the GA4GH specifications are public: the security
# requirements set here are merged into them. Most of them also accept a
# token (`bearerAuth` or none), for the visibility rules of its user; invalid
# tokens are rejected, as on other operations (cf. `check_read_token()` in
# `cloud_registry.ga4gh.registry.permissions`)
paths:
  # Served by FOCA from the config (`service_info`); the controller set here
  # takes precedence over the one added to all operations (`api.specs` in
  # `config.yaml`)
  /service-info:
    get:
      x-openapi-router-controller: foca.api.service_info
      security: []
      description: |
        Get the service info of the registry: the GA4GH `Service`, extended
        with the rules for registrations of the deployment
        (`registrationRules`), so that clients (e.g., forms) can check
        registrations as the registry does instead of configuring the rules
        themselves. Public, also if a deployment requires login for reads.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryServiceInfo'
  /service-info/listing:
    get:
      summary: Tell whether the registry is listed among its services.
      description: |
        Tell admins whether the registry itself is listed among its services
        and, if so, under which identifier. Only for admins.
      operationId: getSelfListing
      x-openapi-router-controller: cloud_registry.ga4gh.registry.self_listing
      tags:
        - cloud-registry
      responses:
        '200':
          description: State of the listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: List the registry among its services.
      description: |
        Add the registry to its own services, or bring its entry up to date
        if it is listed. Only for admins. The entry is built from the service
        info and the public URL of the app with the base path of the API, has
        the identifier of the service info, has no owner, doesn't count for
        any user's limit of services and is verified. Its service type is
        added if it is missing. While listed, the entry is brought up to date
        when the app starts. Nothing is changed if the request fails.
      operationId: putSelfListing
      x-openapi-router-controller: cloud_registry.ga4gh.registry.self_listing
      tags:
        - cloud-registry
      responses:
        '200':
          description: The registry is listed; its entry is up to date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfListing'
        '201':
          description: The registry was added to its services.
          headers:
            Location:
              description: URL of the entry (`/services/{serviceId}`).
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfListing'
        '400':
          description: |
            The registry can't be listed with the current config, saying why
            in `detail`: its environment or the scheme of its public URL isn't
            allowed for services, or its identifier or a URL can't be used
            for services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Nothing was changed (`code`): another service has the same URL and
            API type (`duplicate-service`, named in `serviceId`) or the
            identifier of the service info (`service-id-taken`), the service
            type of the registry is pending (`pending-service`), or the entry
            is being renamed (`service-busy`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ConflictError'
                  - type: object
                    properties:
                      serviceId:
                        type: string
                        description: Identifier of the registered service.
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove the registry from its services.
      description: |
        Remove the entry of the registry from its services, and its service
        type, unless other services have it. Only for admins. Returns `404`
        if the registry isn't listed, and `409` (`service-busy`) while the
        entry is being renamed; try again.
      operationId: deleteSelfListing
      x-openapi-router-controller: cloud_registry.ga4gh.registry.self_listing
      tags:
        - cloud-registry
      responses:
        '200':
          description: The registry is no longer listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /services:
    get:
      security:
        - bearerAuth: []
        - {}
      description: |
        List all services, except pending services (see `GET /approvals`)
        that the user may not see: only admins and users with a role on them
        see them, if they send a token (optional; invalid tokens return
        `401`, as on other operations). Their timestamps (`createdAt`,
        `updatedAt`) are set by the registry: when the service was
        registered, and when it was registered or last updated in the
        registry; unlike in the GA4GH specification, not when the service
        was deployed or updated (see `ExternalServiceRegister`).
    post:
      summary: Register service.
      description: |
        Create a service resource. Services are unique by URL and API type:
        registering a service again returns `409`. Invalid fields return
        `400`, all of them together (see `InvalidRequestError`), e.g.,
        invalid URLs (cf. `ExternalServiceRegister`), environments that the
        deployment doesn't allow, and types that aren't registered if the user
        may not add types (see `POST /services/types`). New
        types count towards the user's limit of unused types (`409` if
        reached; see `POST /services/types`). Users other than admins may
        only have registered a limited number of the registered services
        (`409`, `code`: `services-limit`; deployments set it with
        `custom.access_control.max_services_per_user`, 50 by default, see
        `maxServicesPerUser` of `GET /service-info`); a service counts
        for the user who registered it until it is deleted, whatever its
        roles. Services with a pending type
        are pending (see `GET /approvals`). A service deleted during the
        request returns `404`.
      operationId: postService
      tags:
        - cloud-registry
      requestBody:
        description: Service metadata.
        required: true
        content:
          application/json:
            schema:
              x-body-name: external_service
              $ref: '#/components/schemas/ExternalServiceRegister'
      responses:
        '201':
          $ref: '#/components/responses/ServiceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateService'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /services/import:
    post:
      summary: Get the values for a registration from service info.
      description: |
        Fetch the service info of a service from the address of its endpoint,
        and return the values for a registration (`POST /services`), for users
        to edit and register. Nothing is stored. `url` is set to the address
        without `/service-info`. Only publicly available service info is
        supported: the registry sends no tokens, doesn't follow redirects, and
        only connects to public addresses (unless the deployment permits
        others). Other values than those of the schema are ignored, and the
        values are checked as in a registration (`400` otherwise), except for
        duplicates and whether the user may add the type, which `POST
        /services` checks. Limited per user (`429` above); every failed fetch
        returns the same `502`.
      operationId: postServiceImport
      x-openapi-router-controller: cloud_registry.ga4gh.registry.service_import
      tags:
        - cloud-registry
      requestBody:
        description: Address of the service info.
        required: true
        content:
          application/json:
            schema:
              x-body-name: service_import
              $ref: '#/components/schemas/ServiceImport'
      responses:
        '200':
          description: Values for a registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceRegister'
        '400':
          description: |
            The address doesn't end in `/service-info`, is invalid or has a
            scheme that isn't allowed (the invalid field `serviceInfoUrl` in
            `errors`, see the schema `InvalidRequestError`), or the service
            info doesn't pass the checks of a registration (saying which
            field of the service info in `detail`, without `errors`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: |
            The user has had service info fetched as often per hour as allowed
            (`custom.endpoints.services.service_info.fetches_per_hour`), or
            other requests are fetching service info right now.
          headers:
            Retry-After:
              description: Seconds after which to try again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: |
            The service info could not be fetched, for whichever reason (e.g.,
            the address is not public, or the service requires a token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /services/types:
    get:
      security:
        - bearerAuth: []
        - {}
      description: |
        List the registered service types, sorted by `group`, `artifact` and
        `version`. Unlike in the GA4GH specification (the types of the
        registered services), types are registered on their own: explicitly
        (`POST /services/types`), or with a service of a new type, and all
        types of registered services are listed, except pending types (see
        `GET /approvals`) that the user may not see: only admins and the
        user who added them see them, if they send a token (optional; invalid
        tokens return `401`, as on other operations).
    post:
      summary: Register service type.
      description: |
        Register a service type, e.g., for clients to choose from. Any
        authenticated user can, unless the deployment lets only admins add
        types (`custom.access_control.service_types: controlled`; `403`
        otherwise; see `mayAddServiceTypes` of `GET /me`). If the
        deployment moderates types (`moderated`), the types of users other
        than admins are pending until an admin approves them (see
        `serviceTypesPending` of `GET /me` and `GET /approvals`). Types
        are unique as written: registering a type again returns `409`.
        Users other than admins may only have added a limited number of
        types that no service has (`409` above; deployments set it with
        `custom.access_control.max_unused_service_types`, 10 by default),
        also by registering or changing services.
      operationId: postServiceType
      x-openapi-router-controller: cloud_registry.ga4gh.registry.service_types
      tags:
        - cloud-registry
      requestBody:
        description: Service type.
        required: true
        content:
          application/json:
            schema:
              x-body-name: service_type
              $ref: '#/components/schemas/ServiceTypeRegister'
      responses:
        '201':
          description: The service type was registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove service type.
      description: |
        Remove a registered service type, named by the query parameters
        (as written). Only for admins. Types that registered services have
        can't be removed (`409`); change or delete these services first.
      operationId: deleteServiceType
      x-openapi-router-controller: cloud_registry.ga4gh.registry.service_types
      tags:
        - cloud-registry
      parameters:
        - name: group
          in: query
          description: Group of the service type.
          required: true
          schema:
            type: string
            maxLength: 256
        - name: artifact
          in: query
          description: Artifact of the service type.
          required: true
          schema:
            type: string
            maxLength: 256
        - name: version
          in: query
          description: Version of the service type.
          required: true
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: The service type was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /services/types/approval:
    put:
      summary: Approve service type.
      description: |
        Approve a pending service type (see `GET /approvals`), and so the
        services that have it: they are then listed like all others. Only
        for admins. Approving an approved type changes nothing; there is no
        way back (remove types instead, see `DELETE /services/types`).
      operationId: putServiceTypeApproval
      x-openapi-router-controller: cloud_registry.ga4gh.registry.service_types
      tags:
        - cloud-registry
      requestBody:
        description: Service type.
        required: true
        content:
          application/json:
            schema:
              x-body-name: service_type
              $ref: '#/components/schemas/ServiceTypeRegister'
      responses:
        '200':
          description: The service type is approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}":
    get:
      security:
        - bearerAuth: []
        - {}
      description: |
        Get a service by its identifier; pending services (see `GET
        /approvals`) only for admins and users with a role on them, if
        they send a token (optional; invalid tokens return `401`), `404`
        otherwise. Its timestamps (`createdAt`,
        `updatedAt`) are set by the registry: when the service was
        registered, and when it was registered or last updated in the
        registry; unlike in the GA4GH specification, not when the service
        was deployed or updated (see `ExternalServiceRegister`).
    delete:
      summary: Delete service.
      description: Delete a service resource.
      operationId: deleteService
      tags:
        - cloud-registry
      parameters:
        - name: serviceId
          in: path
          description: Identifier of service to delete.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The service was successfully deleted.
          content:
            application/json:
              schema:
                type: string
                description: Identifier of deleted service.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Register or update service.
      description: |
        Create (`201`) or update (`200`) a service resource. Only admins can
        create services; others can only update services they have a role on
        (`403` otherwise). Services deleted during the request return `404`,
        unless an admin's request creates them again. Services are unique by
        URL and API type: changing them to those of another service returns
        `409`. Invalid URLs return `400` (cf. `ExternalServiceRegister`), as
        do types that aren't registered if the user may not add types (see
        `POST /services/types`). Only admins can update pending services,
        other users only to an approved type (`409` otherwise; see `GET
        /approvals`). New types count towards the user's limit of unused
        types (`409` if reached; see `POST /services/types`).
      operationId: putService
      tags:
        - cloud-registry
      parameters:
        - name: serviceId
          in: path
          description: |
            Identifier of service to register/update; `.` and `..` are not
            allowed, as they are path segments of their own in URLs, and
            neither is `types`, as `/services/types` lists the service types.
          required: true
          schema:
            type: string
            # anything but `.` and `..` (dot segments in URLs) and `types`
            # (`GET /services/types`)
            pattern: '^(?!(\.\.?|types)$)'
      requestBody:
        description: Service metadata.
        required: true
        content:
          application/json:
            schema:
              x-body-name: external_service
              $ref: '#/components/schemas/ExternalServiceRegister'
      responses:
        '200':
          description: The service was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceId'
        '201':
          $ref: '#/components/responses/ServiceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateService'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/rename":
    post:
      summary: Rename service.
      description: |
        Change the identifier of a service. Only for admins. Everything
        stored under the old identifier moves to the new one: the service
        (with its verification and `createdAt`; `updatedAt` is renewed), the
        roles of users and groups on it and the names of these users. The
        service is never registered under both identifiers: the old one
        returns `404` once the service has moved, while its roles are moved.
        New identifiers that are registered (also the service's own) return
        `409` (`code`: `service-id-taken`). Renames wait for other renames and
        changes (`PUT`, `DELETE`, roles) of either identifier, and changes
        wait for renames, for up to about a second (`409` otherwise, `code`:
        `service-busy`; see
        https://cloud-registry.readthedocs.io/en/latest/api/#renaming-services
        for interrupted renames). New identifiers must be usable in URLs
        (not `.`, `..` or `types`; no slashes) and in roles (no commas or
        line breaks), otherwise `400` is returned.
      operationId: renameService
      x-openapi-router-controller: cloud_registry.ga4gh.registry.rename
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        description: New identifier of the service.
        required: true
        content:
          application/json:
            schema:
              x-body-name: rename
              $ref: '#/components/schemas/ServiceRename'
      responses:
        '200':
          description: The service was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The new identifier is registered, or either identifier is being
            renamed or changed; nothing was changed (`code`:
            `service-id-taken` or `service-busy`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/permissions":
    get:
      summary: List service permissions.
      description: |
        List the roles granted on a service, to users (`userId`) and to
        groups (`group`). Only for owners of the service and admins.
      operationId: getServicePermissions
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Roles granted on the service.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/Permission'
                    - $ref: '#/components/schemas/GroupPermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/permissions/users/{userId}":
    put:
      summary: Grant service permission.
      description: |
        Grant a user a role on a service, replacing any other role of the
        user on the service: `owner` (update and delete the service, manage
        its permissions) or `maintainer` (update the service). Only for
        owners of the service and admins. The last owner of a service (user
        or group) cannot be downgraded (`409`).
      operationId: putServicePermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        description: Role to grant.
        required: true
        content:
          application/json:
            schema:
              x-body-name: permission
              $ref: '#/components/schemas/PermissionRegister'
      responses:
        '200':
          description: The role was granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Revoke service permission.
      description: |
        Revoke the roles of a user on a service. Only for owners of the
        service and admins. The last owner of a service (user or group)
        cannot be removed (`409`); delete the service instead. Also deletes
        the invitations to the service that the user created and nobody
        accepted, so that their links stop working.
      operationId: deleteServicePermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The roles were revoked.
          content:
            application/json:
              schema:
                type: string
                description: Identifier of the user.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/permissions/groups/{group}":
    put:
      summary: Grant service permission to group.
      description: |
        Grant a group a role on a service, replacing any other role of the
        group on the service: `owner` (update and delete the service, manage
        its permissions) or `maintainer` (update the service). All members
        of the group (users whose group claim, set by the deployment,
        contains the group) have the role. Only for owners of the service
        who are members of the group (`403` otherwise), and admins, who can
        grant roles to any group. The last owner of a service (user or
        group) cannot be downgraded (`409`).
      operationId: putServiceGroupPermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Group'
      requestBody:
        description: Role to grant.
        required: true
        content:
          application/json:
            schema:
              x-body-name: permission
              $ref: '#/components/schemas/PermissionRegister'
      responses:
        '200':
          description: The role was granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPermission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Revoke service permission of group.
      description: |
        Revoke the roles of a group on a service. Only for owners of the
        service (also if they are not members of the group) and admins. The
        last owner of a service (user or group) cannot be removed (`409`);
        delete the service instead.
      operationId: deleteServiceGroupPermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
