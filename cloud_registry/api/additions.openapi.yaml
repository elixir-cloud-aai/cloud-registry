openapi: 3.0.2
info:
  title: 'Cloud Registry'
  description: |
    Registry of web services, e.g., of GA4GH APIs, for their discovery,
    administration and maintenance, implementing the GA4GH Service Registry
    API; brought to you by ELIXIR On-Cloud. More information on
    [GitHub](https://github.com/elixir-cloud-aai/cloud-registry).
  version: 1.0.0
  license:
    name: 'Apache 2.0'
    url: 'http://www.apache.org/licenses/LICENSE-2.0'
  contact:
    name: 'ELIXIR On-Cloud'
    email: 'cloud-service@elixir-europe.org'
servers:
  - url: /ga4gh/registry/v1
# Read operations of the GA4GH specifications are public: the security
# requirements set here are merged into them. Most of them also accept a
# token (`bearerAuth` or none), for the visibility rules of its user; invalid
# tokens are rejected, as on other operations (cf. `check_read_token()` in
# `cloud_registry.ga4gh.registry.permissions`)
paths:
  # Served by FOCA from the config (`service_info`); the controller set here
  # takes precedence over the one added to all operations (`api.specs` in
  # `config.yaml`)
  /service-info:
    get:
      x-openapi-router-controller: foca.api.service_info
      security: []
      description: |
        Get the service info of the registry: the GA4GH `Service`, extended
        with the rules for registrations of the deployment
        (`registration_rules`), so that clients (e.g., forms) can check
        registrations as the registry does instead of configuring the rules
        themselves. Public, also if a deployment requires login for reads.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryServiceInfo'
  /services:
    get:
      security:
        - bearerAuth: []
        - {}
      description: |
        List all services, except pending services (see `GET /approvals`)
        that the user may not see: only admins and users with a role on them
        see them, if they send a token (optional; invalid tokens return
        `401`, as on other operations). Their timestamps (`createdAt`,
        `updatedAt`) are set by the registry: when the service was
        registered, and when it was registered or last updated in the
        registry; unlike in the GA4GH specification, not when the service
        was deployed or updated (see `ExternalServiceRegister`).
    post:
      summary: Register service.
      description: |
        Create a service resource. Services are unique by URL and API type:
        registering a service again returns `409`. Invalid URLs return `400`
        (cf. `ExternalServiceRegister`), as do types that aren't registered
        if the user may not add types (see `POST /services/types`). New
        types count towards the user's limit of unused types (`409` if
        reached; see `POST /services/types`). Users other than admins may
        only have registered a limited number of the registered services
        (`409`, `code`: `services-limit`; deployments set it with
        `custom.access_control.max_services_per_user`, 50 by default, see
        `max_services_per_user` of `GET /service-info`); a service counts
        for the user who registered it until it is deleted, whatever its
        roles. Services with a pending type
        are pending (see `GET /approvals`). A service deleted during the
        request returns `404`.
      operationId: postService
      tags:
        - cloud-registry
      requestBody:
        description: Service metadata.
        required: true
        content:
          application/json:
            schema:
              x-body-name: external_service
              $ref: '#/components/schemas/ExternalServiceRegister'
      responses:
        '201':
          $ref: '#/components/responses/ServiceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateService'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /services/types:
    get:
      security:
        - bearerAuth: []
        - {}
      description: |
        List the registered service types, sorted by `group`, `artifact` and
        `version`. Unlike in the GA4GH specification (the types of the
        registered services), types are registered on their own: explicitly
        (`POST /services/types`), or with a service of a new type, and all
        types of registered services are listed, except pending types (see
        `GET /approvals`) that the user may not see: only admins and the
        user who added them see them, if they send a token (optional; invalid
        tokens return `401`, as on other operations).
    post:
      summary: Register service type.
      description: |
        Register a service type, e.g., for clients to choose from. Any
        authenticated user can, unless the deployment lets only admins add
        types (`custom.access_control.service_types: controlled`; `403`
        otherwise; see `may_add_service_types` of `GET /me`). If the
        deployment moderates types (`moderated`), the types of users other
        than admins are pending until an admin approves them (see
        `service_types_pending` of `GET /me` and `GET /approvals`). Types
        are unique as written: registering a type again returns `409`.
        Users other than admins may only have added a limited number of
        types that no service has (`409` above; deployments set it with
        `custom.access_control.max_unused_service_types`, 10 by default),
        also by registering or changing services.
      operationId: postServiceType
      x-openapi-router-controller: cloud_registry.ga4gh.registry.service_types
      tags:
        - cloud-registry
      requestBody:
        description: Service type.
        required: true
        content:
          application/json:
            schema:
              x-body-name: service_type
              $ref: '#/components/schemas/ServiceTypeRegister'
      responses:
        '201':
          description: The service type was registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove service type.
      description: |
        Remove a registered service type, named by the query parameters
        (as written). Only for admins. Types that registered services have
        can't be removed (`409`); change or delete these services first.
      operationId: deleteServiceType
      x-openapi-router-controller: cloud_registry.ga4gh.registry.service_types
      tags:
        - cloud-registry
      parameters:
        - name: group
          in: query
          description: Group of the service type.
          required: true
          schema:
            type: string
            maxLength: 256
        - name: artifact
          in: query
          description: Artifact of the service type.
          required: true
          schema:
            type: string
            maxLength: 256
        - name: version
          in: query
          description: Version of the service type.
          required: true
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: The service type was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /services/types/approval:
    put:
      summary: Approve service type.
      description: |
        Approve a pending service type (see `GET /approvals`), and so the
        services that have it: they are then listed like all others. Only
        for admins. Approving an approved type changes nothing; there is no
        way back (remove types instead, see `DELETE /services/types`).
      operationId: putServiceTypeApproval
      x-openapi-router-controller: cloud_registry.ga4gh.registry.service_types
      tags:
        - cloud-registry
      requestBody:
        description: Service type.
        required: true
        content:
          application/json:
            schema:
              x-body-name: service_type
              $ref: '#/components/schemas/ServiceTypeRegister'
      responses:
        '200':
          description: The service type is approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}":
    get:
      security:
        - bearerAuth: []
        - {}
      description: |
        Get a service by its identifier; pending services (see `GET
        /approvals`) only for admins and users with a role on them, if
        they send a token (optional; invalid tokens return `401`), `404`
        otherwise. Its timestamps (`createdAt`,
        `updatedAt`) are set by the registry: when the service was
        registered, and when it was registered or last updated in the
        registry; unlike in the GA4GH specification, not when the service
        was deployed or updated (see `ExternalServiceRegister`).
    delete:
      summary: Delete service.
      description: Delete a service resource.
      operationId: deleteService
      tags:
        - cloud-registry
      parameters:
        - name: serviceId
          in: path
          description: Identifier of service to delete.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The service was successfully deleted.
          content:
            application/json:
              schema:
                type: string
                description: Identifier of deleted service.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Register or update service.
      description: |
        Create (`201`) or update (`200`) a service resource. Only admins can
        create services; others can only update services they have a role on
        (`403` otherwise). Services deleted during the request return `404`,
        unless an admin's request creates them again. Services are unique by
        URL and API type: changing them to those of another service returns
        `409`. Invalid URLs return `400` (cf. `ExternalServiceRegister`), as
        do types that aren't registered if the user may not add types (see
        `POST /services/types`). Only admins can update pending services,
        other users only to an approved type (`409` otherwise; see `GET
        /approvals`). New types count towards the user's limit of unused
        types (`409` if reached; see `POST /services/types`).
      operationId: putService
      tags:
        - cloud-registry
      parameters:
        - name: serviceId
          in: path
          description: |
            Identifier of service to register/update; `.` and `..` are not
            allowed, as they are path segments of their own in URLs, and
            neither is `types`, as `/services/types` lists the service types.
          required: true
          schema:
            type: string
            # anything but `.` and `..` (dot segments in URLs) and `types`
            # (`GET /services/types`)
            pattern: '^(?!(\.\.?|types)$)'
      requestBody:
        description: Service metadata.
        required: true
        content:
          application/json:
            schema:
              x-body-name: external_service
              $ref: '#/components/schemas/ExternalServiceRegister'
      responses:
        '200':
          description: The service was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceId'
        '201':
          $ref: '#/components/responses/ServiceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateService'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/rename":
    post:
      summary: Rename service.
      description: |
        Change the identifier of a service. Only for admins. Everything
        stored under the old identifier moves to the new one: the service
        (with its verification and `createdAt`; `updatedAt` is renewed), the
        roles of users and groups on it and the names of these users. The
        service is never registered under both identifiers: the old one
        returns `404` once the service has moved, while its roles are moved.
        New identifiers that are registered (also the service's own) return
        `409` (`code`: `service-id-taken`). Renames wait for other renames and
        changes (`PUT`, `DELETE`, roles) of either identifier, and changes
        wait for renames, for up to about a second (`409` otherwise, `code`:
        `service-busy`; see
        https://cloud-registry.readthedocs.io/en/latest/api/#renaming-services
        for interrupted renames). New identifiers must be usable in URLs
        (not `.`, `..` or `types`; no slashes) and in roles (no commas or
        line breaks), otherwise `400` is returned.
      operationId: renameService
      x-openapi-router-controller: cloud_registry.ga4gh.registry.rename
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        description: New identifier of the service.
        required: true
        content:
          application/json:
            schema:
              x-body-name: rename
              $ref: '#/components/schemas/ServiceRename'
      responses:
        '200':
          description: The service was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The new identifier is registered, or either identifier is being
            renamed or changed; nothing was changed (`code`:
            `service-id-taken` or `service-busy`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/permissions":
    get:
      summary: List service permissions.
      description: |
        List the roles granted on a service, to users (`user_id`) and to
        groups (`group`). Only for owners of the service and admins.
      operationId: getServicePermissions
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Roles granted on the service.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/Permission'
                    - $ref: '#/components/schemas/GroupPermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/permissions/{userId}":
    put:
      summary: Grant service permission.
      description: |
        Grant a user a role on a service, replacing any other role of the
        user on the service: `owner` (update and delete the service, manage
        its permissions) or `maintainer` (update the service). Only for
        owners of the service and admins. The last owner of a service (user
        or group) cannot be downgraded (`409`).
      operationId: putServicePermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        description: Role to grant.
        required: true
        content:
          application/json:
            schema:
              x-body-name: permission
              $ref: '#/components/schemas/PermissionRegister'
      responses:
        '200':
          description: The role was granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Revoke service permission.
      description: |
        Revoke the roles of a user on a service. Only for owners of the
        service and admins. The last owner of a service (user or group)
        cannot be removed (`409`); delete the service instead.
      operationId: deleteServicePermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The roles were revoked.
          content:
            application/json:
              schema:
                type: string
                description: Identifier of the user.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/permissions/groups/{group}":
    put:
      summary: Grant service permission to group.
      description: |
        Grant a group a role on a service, replacing any other role of the
        group on the service: `owner` (update and delete the service, manage
        its permissions) or `maintainer` (update the service). All members
        of the group (users whose group claim, set by the deployment,
        contains the group) have the role. Only for owners of the service
        who are members of the group (`403` otherwise), and admins, who can
        grant roles to any group. The last owner of a service (user or
        group) cannot be downgraded (`409`).
      operationId: putServiceGroupPermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Group'
      requestBody:
        description: Role to grant.
        required: true
        content:
          application/json:
            schema:
              x-body-name: permission
              $ref: '#/components/schemas/PermissionRegister'
      responses:
        '200':
          description: The role was granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPermission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Revoke service permission of group.
      description: |
        Revoke the roles of a group on a service. Only for owners of the
        service (also if they are not members of the group) and admins. The
        last owner of a service (user or group) cannot be removed (`409`);
        delete the service instead.
      operationId: deleteServiceGroupPermission
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Group'
      responses:
        '200':
          description: The roles were revoked.
          content:
            application/json:
              schema:
                type: string
                description: The group.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/invitations":
    post:
      summary: Invite a user to a service.
      description: |
        Create an invitation to a service for a role (`owner` or
        `maintainer`), to grant it to a user without knowing their user
        identifier: send them a link with the token (`token`, only returned
        here), which they accept (`POST /invitations/accept`) after logging
        in. Clients should put the token in the URL fragment (e.g.,
        `https://portal.example.org/invitations#<token>`), which browsers
        don't send to servers. Invitations are single-use and expire after
        the days that the deployment sets (`expires_at`; by default, 7),
        also once accepted. A service has at most as many invitations that
        haven't expired, open or accepted, as the deployment allows (by
        default, 20; `409` above, `code`: `invitations-limit`). Invitations
        only grant their role while their creator is an owner of the
        service (or created them as an admin). Only for owners of the
        service and admins.
      operationId: postServiceInvitation
      x-openapi-router-controller: cloud_registry.ga4gh.registry.invitations
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        description: Role to grant to the user who accepts the invitation.
        required: true
        content:
          application/json:
            schema:
              x-body-name: invitation
              $ref: '#/components/schemas/InvitationRegister'
      responses:
        '201':
          description: The invitation was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: List the invitations to a service.
      description: |
        List the open and accepted invitations to a service that haven't
        expired, oldest first, without their tokens; accepted ones with who
        accepted them (`accepted`). Only for owners of the service and
        admins.
      operationId: getServiceInvitations
      x-openapi-router-controller: cloud_registry.ga4gh.registry.invitations
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Invitations to the service.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/invitations/{invitationId}":
    delete:
      summary: Revoke an invitation to a service.
      description: |
        Revoke an open invitation to a service, so that it can't be
        accepted. Accepted invitations can't be revoked (`409`, `code`:
        `invitation-accepted`); revoke the role instead (`DELETE
        /services/{serviceId}/permissions/{userId}`). Only for owners of
        the service and admins.
      operationId: deleteServiceInvitation
      x-openapi-router-controller: cloud_registry.ga4gh.registry.invitations
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: The invitation was revoked.
          content:
            application/json:
              schema:
                type: string
                description: Identifier of the invitation.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/verification":
    get:
      summary: Get service verification.
      description: |
        Get the verification of a service, i.e., when an admin verified it
        (e.g., checked that it accepts tokens of the deployment's identity
        provider). Unverified and unknown services return `404`, as do
        pending services (see `GET /approvals`) that the user may not see
        (admins and users with a role on them see them if they send a token;
        optional, invalid tokens return `401`). The verification names the
        URL and API type of the service; it is removed when the URL (in any
        way, as written) or API type (`type.group`, `type.artifact`) of the
        service changes.
      operationId: getServiceVerification
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      security:
        - bearerAuth: []
        - {}
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: The service is verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Verify service.
      description: |
        Mark a service as verified by an admin, at the current time; verifying
        a verified service renews its verification. Only for admins. Send
        the URL and API type that were checked (recommended): the service is
        only verified if it still has exactly that URL (as written) and the
        same API type (`type.group`, `type.artifact`, case-insensitive; not
        `type.version`), otherwise `409` is returned and nothing changes.
        Pending services (see `GET /approvals`) can't be verified (`409`):
        their type is approved first. Invalid URLs in the body, and bodies
        that are neither JSON nor empty (or `null`), return `400`. Without a
        body, the service is verified as it is registered at the time of the
        request. The verification is kept when the service is updated with
        the same URL and API type (e.g., a new version), and
        removed when they change, including other spellings of the URL, and
        when the service becomes pending (e.g., updated to a new version of
        its type that is pending).
      operationId: putServiceVerification
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        description: URL and API type of the service that were checked.
        required: false
        x-body-name: verification
        content:
          application/json:
            schema:
              # requests without a body are validated as `null`
              nullable: true
              $ref: '#/components/schemas/VerificationRegister'
      responses:
        '200':
          description: The service is verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The service has another URL or API type than the one checked, or
            is pending (see `GET /approvals`); nothing was changed (`code`:
            `verification-mismatch` or `pending-service`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove service verification.
      description: |
        Remove the verification of a service. Only for admins. Unverified and
        unknown services return `404`.
      operationId: deleteServiceVerification
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: The verification was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /verifications:
    get:
      summary: List verified services.
      description: |
        List the verified services, sorted by identifier, with their URL and
        API type and the time of their verification. Clients that only use
        verified services list the services (`GET /services`) and keep those
        listed here with the same identifier, URL and API type. Pending
        services (see `GET /approvals`) are only listed to users who see
        them in `GET /services` (with a token; optional, invalid tokens
        return `401`).
      operationId: getVerifications
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      security:
        - bearerAuth: []
        - {}
      tags:
        - cloud-registry
      responses:
        '200':
          description: Verified services.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceVerification'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /approvals:
    get:
      summary: List pending service types and services.
      description: |
        List the pending service types and services that the user may see:
        all for admins; for other users, the types they added and the
        services they have a role on. Types are pending if the deployment
        moderates them (`custom.access_control.service_types: moderated`)
        and a user other than an admin added them, until an admin approves
        them (`PUT /services/types/approval`); services are pending while
        their type is. Users other than admins can't update pending
        services (`409`), except to an approved type, but their owners can
        delete them.
      operationId: getApprovals
      x-openapi-router-controller: cloud_registry.ga4gh.registry.service_types
      tags:
        - cloud-registry
      responses:
        '200':
          description: Pending service types and services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approvals'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /invitations/accept:
    post:
      summary: Accept an invitation to a service.
      description: |
        Accept an invitation to a service, which grants its role to the
        current user, replacing any other role of the user on the service
        (as `PUT /services/{serviceId}/permissions/{userId}`; the last owner
        of a service can't be downgraded, `409`). The token goes in the
        body, not in the URL, so that it doesn't end up in access logs.
        Each invitation can be accepted once (`409`, `code`:
        `invitation-accepted`); unknown, revoked and expired ones are not
        found (`404`), as are invitations to deleted services and those
        whose creator is no longer an owner of the service (which are
        deleted). Users whose roles the permissions API couldn't revoke
        (identifiers that `userId` doesn't allow) can't accept invitations
        (`400`). Stores the user's display name for the service (as `GET
        /me`), and shows it and the verified email address, if the identity
        provider releases them, to owners in the invitation until it expires
        or the user's roles on the service are revoked. For any
        authenticated user.
      operationId: acceptInvitation
      x-openapi-router-controller: cloud_registry.ga4gh.registry.invitations
      tags:
        - cloud-registry
      requestBody:
        description: Token of the invitation.
        required: true
        content:
          application/json:
            schema:
              x-body-name: acceptance
              $ref: '#/components/schemas/InvitationAccept'
      responses:
        '200':
          description: The invitation was accepted, and its role granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      summary: Get the current user.
      description: |
        Get the identifier of the current user, whether they act as an admin
        (admin mode) and may do so, and their roles on services. Also stores
        or refreshes the user's display name (from the identity provider) for
        these services, where their owners and admins can see it with the
        roles.
      operationId: getMe
      x-openapi-router-controller: cloud_registry.ga4gh.registry.permissions
      tags:
        - cloud-registry
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    ServiceId:
      name: serviceId
      in: path
      description: Identifier of the service.
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      description: |
        Identifier of the user (`user_id` of `GET /me`), i.e., the `sub`
        claim of the user's tokens (e.g., `abc123@login.example.org`); if
        the deployment trusts several token issuers, namespaced by issuer
        (e.g., `https://login.example.org/|abc123`), URL-encoded (e.g., `|`
        as `%7C`; may contain `/`, but not start with it, cf. `group`). Not
        `groups`, and not starting with `groups/`: the path is then that of
        the roles of groups, so it is not found (`404`) or names a group.
        Segments `.` and `..` (the whole identifier, or between slashes or
        backslashes, which browsers take as slashes) are not allowed
        (`400`), as clients resolve them in URLs.
      required: true
      schema:
        type: string
        # may contain slashes (namespaced subjects, e.g., issuer URLs), but no
        # dot segments (`.`, `..`), also between backslashes (cf. `Group`);
        # `[\s\S]`, as `.` doesn't match line breaks
        format: path
        pattern: '^(?!([\s\S]*[/\\])?\.\.?([/\\]|$))'
    Group:
      name: group
      in: path
      description: |
        Group, i.e., a value of the group claim of the members' tokens
        (`security.access_control.claim_groups`, set by the deployment; e.g.,
        `urn:example:group:registry-team#login.example.org`), URL-encoded
        (e.g., `#` as `%23`; may contain `/`, but not start with it: the
        path then has a double slash, which is redirected to the path
        without it, i.e., to another group). Segments `.` and `..` (the
        whole group, or between slashes or backslashes, which browsers take
        as slashes) are not allowed (`400`), as clients resolve them in URLs
        if slashes aren't encoded.
      required: true
      schema:
        type: string
        # may contain slashes (e.g., URLs), but no dot segments (`.`, `..`),
        # also between backslashes (WHATWG URLs)
        format: path
        pattern: '^(?!([\s\S]*[/\\])?\.\.?([/\\]|$))'
    InvitationId:
      name: invitationId
      in: path
      description: Identifier of the invitation (`id`).
      required: true
      schema:
        type: string
  responses:
    ServiceCreated:
      description: The service was successfully registered.
      headers:
        Location:
          description: URL of the registered service (`/services/{serviceId}`).
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceId'
    # Errors are problem details (RFC 7807), sent as `application/json`, as
    # the GA4GH specifications declare (`exceptions.media_type` in
    # `config.yaml`); the other error responses are those of the GA4GH
    # specification
    BadRequest:
      description: 'Bad request ([RFC 7235](https://tools.ietf.org/html/rfc7235))'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with the current state of the resource; `code`
        tells why (see the schema `ConflictError`). E.g., `service-busy` for
        changes of services (`DELETE /services/{serviceId}`, roles) while they
        are renamed; try again later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'
    DuplicateService:
      description: |
        A service with the same URL and API type (`type.group` and
        `type.artifact`, case-insensitive) is registered. URLs are compared
        after normalizing common spellings (e.g., case of schemes and hosts,
        default ports, trailing slashes, queries and fragments; see
        https://cloud-registry.readthedocs.io/en/latest/api/#duplicate-services).
        For users who may read the registered service (`GET
        /services/{serviceId}`), `serviceId` names it (also in `detail`);
        contact its owner or an admin. For other users (e.g., if a deployment
        requires login for reads), the problem details neither have
        `serviceId` nor name the service in `detail`.
        Also returned, without `serviceId`, for updates of pending services
        by users other than admins (`PUT /services/{serviceId}`; see `GET
        /approvals`), and for new types of users who have added as many
        unused types as allowed (see `POST /services/types`), and for new
        services of users who have registered as many services as allowed
        (see `POST /services`); `code` tells these conflicts apart
        (`duplicate-service`, `pending-service`, `unused-types-limit`,
        `services-limit`), and for services that are being renamed
        (`service-busy`, `PUT /services/{serviceId}`).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ConflictError'
              - type: object
                properties:
                  serviceId:
                    type: string
                    description: |
                      Identifier of the registered service; only for users
                      who may read it.
  schemas:
    ConflictError:
      description: |
        Problem details of a `409 Conflict`, with a code that tells
        conflicts apart: unlike `detail`, codes are stable, so clients
        branch on them.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: |
                Why the request conflicts with the current state:

                - `duplicate-service`: a service with the same URL and API
                  type is registered (`POST /services`, `PUT
                  /services/{serviceId}`).
                - `pending-service`: the service is pending (see `GET
                  /approvals`), so users other than admins can't update it
                  (`PUT /services/{serviceId}`), and it can't be verified
                  (`PUT /services/{serviceId}/verification`).
                - `unused-types-limit`: the user has added as many service
                  types that no service has as allowed (`POST
                  /services/types`, `POST /services`, `PUT
                  /services/{serviceId}`).
                - `services-limit`: the user has registered as many services
                  as allowed (`POST /services`).
                - `service-type-registered`: the service type is registered,
                  also if it is pending (`POST /services/types`).
                - `service-type-in-use`: services have the service type
                  (`DELETE /services/types`).
                - `verification-mismatch`: the service has another URL or
                  API type than the one checked (`PUT
                  /services/{serviceId}/verification`).
                - `last-owner`: the subject is the last owner of the service
                  (`PUT` and `DELETE` of
                  `/services/{serviceId}/permissions/...`, `POST
                  /invitations/accept`).
                - `invitations-limit`: the service has as many
                  invitations that haven't expired as allowed (`POST
                  /services/{serviceId}/invitations`).
                - `invitation-accepted`: the invitation was accepted already
                  (`POST /invitations/accept`, `DELETE
                  /services/{serviceId}/invitations/{invitationId}`).
                - `service-id-taken`: a service with the new identifier is
                  registered (`POST /services/{serviceId}/rename`).
                - `service-busy`: the service is being renamed (`PUT` and
                  `DELETE` of `/services/{serviceId}` and
                  `/services/{serviceId}/permissions/...`), or the service or
                  the new identifier is being renamed or changed (`POST
                  /services/{serviceId}/rename`); try again later.
                - `conflict`: other conflicts (e.g., changes of policy rules
                  set in the configuration via FOCA's permissions API).

                Further codes may be added (so the codes are an extensible
                enum, not a closed one); treat unknown ones like `conflict`.
              x-extensible-enum:
                - duplicate-service
                - pending-service
                - unused-types-limit
                - services-limit
                - service-type-registered
                - service-type-in-use
                - verification-mismatch
                - last-owner
                - invitations-limit
                - invitation-accepted
                - service-id-taken
                - service-busy
                - conflict
    ServiceId:
      description: Service identifier.
      type: string
    # Extension of the GA4GH `Service` schema, as GA4GH APIs extend it for
    # their service info (e.g., `TesServiceInfo` of the TES specification);
    # extension fields are snake_case, as the other fields the registry adds
    RegistryServiceInfo:
      description: |
        Service info of the registry: a GA4GH service, with the rules for
        registrations of the deployment.
      allOf:
        - $ref: '#/components/schemas/Service'
        - type: object
          required:
            - registration_rules
          properties:
            registration_rules:
              $ref: '#/components/schemas/RegistrationRules'
    RegistrationRules:
      description: |
        Rules for registrations of services and service types, as configured
        by the deployment; registrations that break them are rejected. Set
        by the app from the config in effect, so that clients can check
        registrations in advance, rather than configuring the rules
        themselves.
      type: object
      required:
        - environments
        - url_schemes
        - service_types
      additionalProperties: false
      properties:
        environments:
          type: array
          description: |
            Values allowed for the environment of services (`environment`;
            case-sensitive; `400` otherwise); empty if any value is allowed
            (`custom.endpoints.services.environments`).
          items:
            type: string
          example: ['prod', 'test', 'dev', 'staging']
        url_schemes:
          type: array
          description: |
            Schemes allowed in service URLs (`url`; `400` otherwise): `https`
            and, if the deployment allows it, `http`
            (`custom.endpoints.services.url_schemes`). Links (e.g.,
            `documentationUrl`) may be HTTP(S) URLs either way.
          minItems: 1
          items:
            type: string
            enum:
              - http
              - https
          example: ['https']
        service_types:
          type: string
          description: |
            Who may add service types (`custom.access_control.service_types`):
            `open`, any authenticated user; `controlled`, admins only;
            `moderated`, any authenticated user, but types of users other
            than admins are pending until an admin approves them (see `POST
            /services/types`). Whether the current user may add types, and
            whether they are pending, is in `GET /me`.
          enum:
            - open
            - controlled
            - moderated
          example: 'open'
        max_unused_service_types:
          type: integer
          minimum: 0
          description: |
            How many service types that no service has a user other than an
            admin may have added (`409` above; see `POST /services/types`);
            `0` if they can't add types (explicitly or with services): in
            mode `controlled` (`service_types`), whatever the configured
            limit, or if the limit is `0`. Not set if there is no limit
            (`custom.access_control.max_unused_service_types: null`) in the
            other modes.
            Concurrent requests of a user can exceed it by their number.
          example: 10
        max_services_per_user:
          type: integer
          minimum: 0
          description: |
            How many of the registered services a user other than an admin
            may have registered (`409` above; see `POST /services`); `0` if
            only admins can register services. Not set if there is no limit
            (`custom.access_control.max_services_per_user: null`).
          example: 50
    ServiceRename:
      description: New identifier of a service.
      type: object
      required:
        - id
      additionalProperties: false
      properties:
        id:
          type: string
          description: |
            New identifier of the service; not `.`, `..` or `types`, and
            without slashes (cf. `PUT /services/{serviceId}`).
          minLength: 1
          # as `serviceId` of `PUT /services/{serviceId}`, which can't contain
          # slashes either
          pattern: '^(?!(\.\.?|types)$)[^/]+$'
    PermissionRegister:
      description: Role to grant on a service.
      type: object
      required:
        - role
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
    Permission:
      description: Role of a user on a service.
      type: object
      required:
        - user_id
        - role
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: Identifier of the user.
        name:
          type: string
          description: |
            Display name of the user, if known, i.e., if the user has used
            the registry since being granted a role.
        role:
          $ref: '#/components/schemas/Role'
    GroupPermission:
      description: Role of a group on a service.
      type: object
      required:
        - group
        - role
      additionalProperties: false
      properties:
        group:
          type: string
          description: |
            The group, i.e., a value of the group claim of its members'
            tokens (`security.access_control.claim_groups`).
        role:
          $ref: '#/components/schemas/Role'
    Me:
      description: The current user.
      type: object
      required:
        - user_id
        - admin
        - admin_available
        - may_add_service_types
        - service_types_pending
        - services
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: |
            Identifier of the user: the `sub` claim of their tokens, or, if
            the deployment trusts several token issuers, the claim
            namespaced by issuer (`<namespace>|<sub>`). To be granted roles,
            users give this exact value to owners of services; a bare `sub`
            claim doesn't match if the identifier is namespaced.
        admin:
          type: boolean
          description: |
            Whether the user acts as an admin on this request: in admin mode,
            i.e., if the request asks for the role in the header
            `X-Request-Roles` (e.g., `X-Request-Roles: admin`) and the user
            may switch to it (`admin_available`). Without admin mode, admins
            have the permissions of other users. Also true without the
            header for users granted the role by stored rules (from before
            admin mode) and in deployments without admin mode
            (`security.access_control.opt_in_roles: []`).
        admin_available:
          type: boolean
          description: |
            Whether the user may switch to admin mode: a member of a group
            mapped to the role `admin` (with or without the header); also
            true whenever `admin` is (e.g., in deployments without admin
            mode).
        may_add_service_types:
          type: boolean
          description: |
            Whether the user may add service types, explicitly (`POST
            /services/types`) or by registering a service with a new type:
            admins always, other users unless the deployment lets only admins
            add types (`custom.access_control.service_types: controlled`).
        service_types_pending:
          type: boolean
          description: |
            Whether the types that the user adds are pending until an admin
            approves them, and so the services that have them (see `GET
            /approvals`): for users other than admins, if the deployment
            moderates types (`custom.access_control.service_types:
            moderated`).
        services:
          type: array
          description: |
            Roles of the user on services: granted to the user, and granted
            to groups the user is a member of (with `group`), sorted by
            service identifier; a service is listed once per role.
          items:
            $ref: '#/components/schemas/ServiceRole'
    Approvals:
      description: Pending service types and services.
      type: object
      required:
        - service_types
        - services
      additionalProperties: false
      properties:
        service_types:
          type: array
          description: Pending service types, sorted by group, artifact and version.
          items:
            $ref: '#/components/schemas/ServiceType'
        services:
          type: array
          description: Pending services, sorted by identifier.
          items:
            $ref: '#/components/schemas/ExternalService'
    ServiceRole:
      description: Role of the current user on a service.
      type: object
      required:
        - service_id
        - role
      additionalProperties: false
      properties:
        service_id:
          type: string
          description: Identifier of the service.
        role:
          $ref: '#/components/schemas/Role'
        group:
          type: string
          description: |
            Group the role was granted to, of which the user is a member;
            not set for roles granted to the user.
    InvitationRegister:
      description: Role to grant to the user who accepts an invitation.
      type: object
      required:
        - role
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
    Invitation:
      description: Invitation to a service.
      type: object
      required:
        - id
        - service_id
        - role
        - created_by
        - created_at
        - expires_at
      additionalProperties: false
      properties:
        id:
          type: string
          description: Identifier of the invitation.
        service_id:
          type: string
          description: Identifier of the service.
        role:
          $ref: '#/components/schemas/Role'
        created_by:
          type: string
          description: Identifier of the user who created the invitation.
        created_at:
          type: string
          format: date-time
          description: When the invitation was created (RFC 3339 format, UTC).
          example: '2026-10-28T12:34:56.789Z'
        expires_at:
          type: string
          format: date-time
          description: |
            When the invitation expires (RFC 3339 format, UTC), whether
            accepted or not; it is no longer listed then.
          example: '2026-11-04T12:34:56.789Z'
        accepted:
          $ref: '#/components/schemas/InvitationAcceptance'
    # The fields of `Invitation` and the token; not `allOf`, as both forbid
    # other fields
    InvitationCreated:
      description: New invitation to a service, with its token.
      type: object
      required:
        - id
        - service_id
        - role
        - created_by
        - created_at
        - expires_at
        - token
      additionalProperties: false
      properties:
        id:
          type: string
          description: Identifier of the invitation.
        service_id:
          type: string
          description: Identifier of the service.
        role:
          $ref: '#/components/schemas/Role'
        created_by:
          type: string
          description: Identifier of the user who created the invitation.
        created_at:
          type: string
          format: date-time
          description: When the invitation was created (RFC 3339 format, UTC).
          example: '2026-10-28T12:34:56.789Z'
        expires_at:
          type: string
          format: date-time
          description: |
            When the invitation expires (RFC 3339 format, UTC), whether
            accepted or not.
          example: '2026-11-04T12:34:56.789Z'
        token:
          type: string
          description: |
            Token of the invitation, to send to the invited user (e.g., in
            the fragment of a link); only returned when the invitation is
            created, as the registry stores its hash only.
    InvitationAcceptance:
      description: |
        Who accepted an invitation, and when; not set for open invitations.
      type: object
      required:
        - user_id
        - accepted_at
      additionalProperties: false
      properties:
        user_id:
          type: string
          description: |
            Identifier of the user who accepted the invitation; the only
            reliable identification of the user.
        name:
          type: string
          description: |
            Display name of the user, if the identity provider released it;
            for display only, as users may be able to choose it.
        email:
          type: string
          description: |
            Email address of the user, if the identity provider released it
            as verified (`email_verified`; e.g., if the deployment adds
            `email` and `email_verified` to `security.auth.userinfo_claims`).
        accepted_at:
          type: string
          format: date-time
          description: When the invitation was accepted (RFC 3339 format, UTC).
          example: '2026-10-29T08:00:00.000Z'
    InvitationAccept:
      description: Token of an invitation to accept.
      type: object
      required:
        - token
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: Token of the invitation (`token` of its creation).
    VerificationRegister:
      description: URL and API type of a service that an admin checked.
      type: object
      required:
        - url
        - type
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: URL of the service, exactly as registered.
          example: 'https://tes.example.org/ga4gh/tes/v1'
        type:
          $ref: '#/components/schemas/ServiceTypeRegister'
    Verification:
      description: |
        Verification of a service by an admin, with the URL and API type of
        the service.
      type: object
      required:
        - url
        - type
        - verified_at
      additionalProperties: false
      properties:
        url:
          $ref: '#/components/schemas/VerifiedUrl'
        type:
          $ref: '#/components/schemas/ServiceType'
        verified_at:
          $ref: '#/components/schemas/VerifiedAt'
    VerifiedUrl:
      description: URL of the verified service, as registered.
      type: string
      example: 'https://tes.example.org/ga4gh/tes/v1'
    VerifiedAt:
      description: |
        When an admin verified the service (RFC 3339 format, UTC).
      type: string
      format: date-time
      example: '2026-10-20T12:34:56.789Z'
    ServiceVerification:
      description: Verification of a service, with its identifier.
      type: object
      required:
        - service_id
        - url
        - type
        - verified_at
      additionalProperties: false
      properties:
        service_id:
          $ref: '#/components/schemas/ServiceId'
        url:
          $ref: '#/components/schemas/VerifiedUrl'
        type:
          $ref: '#/components/schemas/ServiceType'
        verified_at:
          $ref: '#/components/schemas/VerifiedAt'
    Role:
      description: |
        Role on a service: `owner` (update and delete the service, manage
        its permissions) or `maintainer` (update the service).
      type: string
      enum:
        - owner
        - maintainer
    # Registration schemas (also `VerificationRegister`) limit the length of
    # strings, which the GA4GH schemas do not limit; see `docs/api.md`
    ExternalServiceRegister:
      description: |
        GA4GH service with a URL. URLs (`url`, `organization.url`,
        `contactUrl`, `documentationUrl`) must be HTTP(S) URLs with a host,
        without user info, whitespace, control or format characters (except
        joiners in international host names), characters that URLs only
        allow percent-encoded (e.g., `<`, `|`) or malformed percent-encodings;
        `contactUrl` can also be a `mailto:` URL with email addresses. The
        service URL (`url`) must be an `https` URL, unless the deployment
        also allows `http`. Others return `400`. The registry sets the
        timestamps (`createdAt`, `updatedAt`), so those sent are ignored,
        except for admins (e.g., to keep the timestamps of imported
        services; `updatedAt` is only kept for new services), whose
        timestamps must be RFC 3339 date-times (`400` otherwise). The
        environment (`environment`) must be one of the values that the
        deployment allows, by default `prod`, `test`, `dev` and `staging`
        (`400` otherwise).
      type: object
      required:
        - name
        - type
        - organization
        - version
        - url
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 1024
          description: 'Name of this service. Should be human readable.'
          example: 'My project'
        type:
          $ref: '#/components/schemas/ServiceTypeRegister'
        description:
          type: string
          maxLength: 4096
          description: 'Description of the service. Should be human readable and provide information about the service.'
          example: 'This service provides...'
        organization:
          type: object
          description: 'Organization providing the service (only `name` and `url`; other fields return `400`)'
          required:
            - name
            - url
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 1024
              description: 'Name of the organization responsible for the service'
              example: 'My organization'
            url:
              type: string
              format: uri
              maxLength: 2048
              description: 'URL of the website of the organization (RFC 3986 format; HTTP(S))'
              example: 'https://example.com'
        contactUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 'URL of the contact for the provider of this service, e.g. a link to a contact form (RFC 3986 format; HTTP(S)), or an email (RFC 2368 format; `mailto:`).'
          example: 'mailto:support@example.com'
        documentationUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 'URL of the documentation of this service (RFC 3986 format; HTTP(S)). This should help someone learn how to use your service, including any specifics required to access data, e.g. authentication.'
          example: 'https://docs.myservice.example.com'
        createdAt:
          type: string
          format: date-time
          description: |
            When the service was registered (RFC 3339 format), set by the registry and kept on updates; unlike in the GA4GH specification, not when it was first deployed.
          example: '2019-06-04T12:58:19Z'
        updatedAt:
          type: string
          format: date-time
          description: |
            When the service was registered or last updated in the registry (RFC 3339 format), set by the registry; unlike in the GA4GH specification, not when the service itself was last updated.
          example: '2019-06-04T12:58:19Z'
        environment:
          type: string
          maxLength: 256
          description: 'Environment the service is running in. Use this to distinguish between production, development and testing/staging deployments. Must be one of the values that the deployment allows (`custom.endpoints.services.environments`), by default prod, test, dev and staging (`400` otherwise).'
          example: 'test'
        version:
          type: string
          maxLength: 256
          description: 'Version of the service being described. Semantic versioning is recommended, but other identifiers, such as dates or commit hashes, are also allowed. The version should be changed whenever the service is updated.'
          example: '1.0.0'
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Base URL of the service ([RFC 3986](https://tools.ietf.org/html/rfc3986) format; HTTPS, or HTTP if the deployment allows it).

            For REST API services, this is the URL to which all endpoints should be relative. In particular, services implementing GA4GH specifications defined in OAS format (as per the `type` field) should respond to requests constructed by appending relative paths from the specification to this base URL (e.g. `{url}/service-info`). See [API Server and Base URL](https://swagger.io/docs/specification/api-host-and-base-path/) for more information on specifying base URLs in OAS 3.
          example: 'https://api.example.com/v1'
    ServiceTypeRegister:
      description: 'Type of a GA4GH service'
      type: object
      required:
        - group
        - artifact
        - version
      additionalProperties: false
      properties:
        group:
          type: string
          maxLength: 256
          description: 'Namespace in reverse domain name format. Use `org.ga4gh` for implementations compliant with official GA4GH specifications. For services with custom APIs not standardized by GA4GH, or implementations diverging from official GA4GH specifications, use a different namespace (e.g. your organization''s reverse domain name).'
          example: 'org.ga4gh'
        artifact:
          type: string
          maxLength: 256
          description: 'Name of the API or GA4GH specification implemented. Official GA4GH types should be assigned as part of standards approval process. Custom artifacts are supported.'
          example: 'beacon'
        version:
          type: string
          maxLength: 256
          description: 'Version of the API or specification. GA4GH specifications use semantic versioning.'
          example: '1.0.0'
