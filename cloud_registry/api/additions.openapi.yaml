        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/verification":
    get:
      summary: Get service verification.
      description: |
        Get the verification of a service, i.e., when an admin verified it
        (e.g., checked that it accepts tokens of the deployment's identity
        provider). Unverified and unknown services return `404`, as do
        pending services (see `GET /approvals`) that the user may not see
        (admins and users with a role on them see them if they send a token;
        optional, invalid tokens return `401`). The verification names the
        URL and API type of the service; it is removed when the URL (in any
        way, as written) or API type (`type.group`, `type.artifact`) of the
        service changes.
      operationId: getServiceVerification
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      security:
        - bearerAuth: []
        - {}
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: The service is verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Verify service.
      description: |
        Mark a service as verified by an admin, at the current time; verifying
        a verified service renews its verification. Only for admins. Send
        the URL and API type that were checked (recommended): the service is
        only verified if it still has exactly that URL (as written) and the
        same API type (`type.group`, `type.artifact`, case-insensitive; not
        `type.version`), otherwise `409` is returned and nothing changes.
        Pending services (see `GET /approvals`) can't be verified (`409`):
        their type is approved first. Invalid URLs in the body, and bodies
        that are neither JSON nor empty (or `null`), return `400`. Without a
        body, the service is verified as it is registered at the time of the
        request. The verification is kept when the service is updated with
        the same URL and API type (e.g., a new version), and
        removed when they change, including other spellings of the URL, and
        when the service becomes pending (e.g., updated to a new version of
        its type that is pending).
      operationId: putServiceVerification
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        description: URL and API type of the service that were checked.
        required: false
        x-body-name: verification
        content:
          application/json:
            schema:
              # requests without a body are validated as `null`
              nullable: true
              $ref: '#/components/schemas/VerificationRegister'
      responses:
        '200':
          description: The service is verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The service has another URL or API type than the one checked, or
            is pending (see `GET /approvals`); nothing was changed (`code`:
            `verification-mismatch` or `pending-service`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove service verification.
      description: |
        Remove the verification of a service. Only for admins. Unverified and
        unknown services return `404`.
      operationId: deleteServiceVerification
      x-openapi-router-controller: cloud_registry.ga4gh.registry.verification
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: The verification was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/sync":
    get:
      summary: Get the sync state of a service.
      description: |
        Get whether a service is in sync with its service info. Services without
        sync return `404` (they may have drifted), as do unknown services, pending
        services (see `GET /approvals`) that the user may not see, and all services
        if the deployment doesn't sync. Verified and synced doesn't mean trusted:
        users decide.
      operationId: getServiceSync
      x-openapi-router-controller: cloud_registry.ga4gh.registry.sync
      security:
        - bearerAuth: []
        - {}
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Sync state of the service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sync'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Turn sync of a service on, or sync it now.
      description: |
        Fetch the service info of the service (`{url}/service-info`), apply it and
        keep doing so periodically. For owners, maintainers and admins. The first
        fetch must succeed, or nothing changes; service info that can't be applied
        (e.g., a type awaiting approval) turns sync on with a `reason`. While sync
        is on, updates with another `url` return `409`, and other changes of
        synced fields last until the next sync. Limited per user, like `POST
        /services/import` (`429` above); every failed fetch returns the same `502`.
        With `onlyIfEnabled`, a service without sync returns `404`, without a fetch,
        so that "sync now" can't turn on what someone just turned off.
      operationId: putServiceSync
      x-openapi-router-controller: cloud_registry.ga4gh.registry.sync
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - name: onlyIfEnabled
          in: query
          required: false
          description: Only sync if sync is on; never turn it on.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Sync state of the service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sync'
        '400':
          description: The service info doesn't pass the checks of a registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Too many fetches (see `POST /services/import`).
          headers:
            Retry-After:
              description: Seconds after which to try again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: The service info could not be fetched, for whichever reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Turn sync of a service off.
      description: |
        The service keeps its values, and can change its URL again. For owners,
        maintainers and admins.
      operationId: deleteServiceSync
      x-openapi-router-controller: cloud_registry.ga4gh.registry.sync
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Identifier of the service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /syncs:
