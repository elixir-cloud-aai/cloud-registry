        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  "/services/{serviceId}/invitations":
    post:
      summary: Invite a user to a service.
      description: |
        Create an invitation to a service for a role (`owner` or
        `maintainer`), to grant it to a user without knowing their user
        identifier: send them a link with the token (`token`, only returned
        here), which they accept (`POST /invitations/accept`) after logging
        in. Clients should put the token in the URL fragment (e.g.,
        `https://portal.example.org/invitations#<token>`), which browsers
        don't send to servers. An optional `label` says what the invitation
        is for; only those who can list the invitations see it. Invitations
        are single-use and expire after the days that the deployment sets
        (`expiresAt`; by default, 7), also once accepted. A service has at
        most as many invitations that haven't expired, open or accepted, as
        the deployment allows (by default, 20; `409` above, `code`:
        `invitations-limit`); accepted ones count until they expire, also if
        lists leave them out. Invitations
        only grant their role while their creator is an owner of the
        service (or created them as an admin). Only for owners of the
        service and admins.
      operationId: postServiceInvitation
      x-openapi-router-controller: cloud_registry.ga4gh.registry.invitations
      tags:
        - cloud-registry
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        description: |
          Role to grant to the user who accepts the invitation, and optionally
          a label for those who manage it.
        required: true
        content:
          application/json:
            schema:
              x-body-name: invitation
              $ref: '#/components/schemas/InvitationRegister'
      responses:
        '201':
          description: The invitation was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: List the invitations to a service.
      description: |
        List the invitations to a service that weren't accepted, oldest
        first, without their tokens, with their status (`status`) and labels
        (`label`), if any. Expired invitations stay listed until they are
        removed (`DELETE`), or automatically after the days that the deployment
        sets (by default, 30), so that owners can see who didn't accept in
        time. With `includeAccepted`, also lists the accepted invitations
        that haven't expired, with who accepted them (`accepted`). Only for
        owners of the service and admins.
      operationId: getServiceInvitations
      x-openapi-router-controller: cloud_registry.ga4gh.registry.invitations
