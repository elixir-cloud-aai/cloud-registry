        List the services with sync, sorted by identifier. Clients on the safe side
        keep the services (`GET /services`) that are listed here as `synced` and in
        `GET /verifications`, with the same identifier, URL and API type. Verified
        and synced doesn't mean trusted: users decide. Pending services (see `GET
        /approvals`) are only listed to users who see them in `GET /services`.
