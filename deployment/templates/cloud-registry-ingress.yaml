{{ if .Values.cloud_registry.ingress.enabled }}
{{- $ingress := .Values.cloud_registry.ingress -}}
{{- /*
Annotations from `ingress.annotations` take precedence over those set by the
chart: the app's size limit of request bodies for ingress-nginx (in bytes),
and those requesting a certificate from cert-manager; `null` removes them.
*/ -}}
{{- $annotations := dict "nginx.ingress.kubernetes.io/proxy-body-size" (include "cloud-registry.maxContentLength" .) -}}
{{- if $ingress.https.enabled -}}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" $ingress.https.issuer -}}
{{- $_ := set $annotations "kubernetes.io/tls-acme" "true" -}}
{{- end -}}
{{- range $key, $value := $ingress.annotations | default dict -}}
{{- if kindIs "invalid" $value -}}
{{- $_ := unset $annotations $key -}}
{{- else -}}
{{- $_ := set $annotations $key $value -}}
{{- end -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "cloud-registry.fullname" . | quote }}
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
  - host: {{ .Values.host_name | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "cloud-registry.fullname" . | quote }}
            port:
              name: http
{{- if $ingress.https.enabled }}
  tls:
  - hosts:
    - {{ .Values.host_name | quote }}
    secretName: {{ printf "%s-ingress-secret" (include "cloud-registry.fullname" .) | quote }}
{{- end }}
{{ end }}
