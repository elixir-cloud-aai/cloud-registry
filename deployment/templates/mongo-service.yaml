apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-registry.mongodbFullname" . | quote }}
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "mongodb") | nindent 4 }}
spec:
  ports:
  - name: mongodb
    port: 27017
    protocol: TCP
    targetPort: mongodb
  selector:
    {{- include "cloud-registry.selectorLabels" (dict "root" . "component" "mongodb") | nindent 4 }}
  sessionAffinity: None
  type: ClusterIP
