apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-registry.fullname" . }}
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    {{- include "cloud-registry.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
  sessionAffinity: None
  type: ClusterIP
