{{ if include "cloud-registry.routeEnabled" . }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "cloud-registry.fullname" . | quote }}
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  host: {{ .Values.host_name | quote }}
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: {{ include "cloud-registry.fullname" . | quote }}
    weight: 100
  wildcardPolicy: None
{{ end }}
