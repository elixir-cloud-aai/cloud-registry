{{ if .Values.cloudRegistry.networkPolicy.enabled }}
{{- /*
Only the peers in `ingressFrom` (by default, the namespace of ingress-nginx)
may connect to the app; connections from the pod's node (the kubelet's
probes) are always allowed. Egress is not restricted, as the app connects to
MongoDB and to the token issuers (OpenID Connect discovery, JWKS).
*/ -}}
{{- $from := .Values.cloudRegistry.networkPolicy.ingressFrom -}}
{{- /* The schema rejects an empty list, but not `null` (no list) */ -}}
{{- if not $from -}}
{{- fail "cloudRegistry.networkPolicy.ingressFrom must list at least one NetworkPolicy peer (no peers would allow all sources); set cloudRegistry.networkPolicy.enabled to false to allow all sources" -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-registry.fullname" . | quote }}
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloud-registry.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
      {{- toYaml $from | nindent 4 }}
    ports:
    - port: 8080
      protocol: TCP
{{ end }}
