apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cloud-registry.mongodbFullname" . | quote }}
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "mongodb") | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongodb.volumeSize }}
