{{- if .Values.mongodb.auth.enabled }}
{{- /*
Run by MongoDB on its first start with an empty data directory, as the root
user; FOCA creates the app's collections and indexes on startup.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloud-registry.mongodbFullname" . }}-init-script
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "mongodb") | nindent 4 }}
data:
  create-app-user.js: |
    // Create the app user with access to the app's database only; FOCA puts
    // the database in the connection string, so the app authenticates
    // against it. Change the database here if `db.dbs` in the config does.
    db.getSiblingDB('serviceStore').createUser({
      user: process.env.MONGO_APP_USERNAME,
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: 'readWrite', db: 'serviceStore' }],
    });
{{- end }}
