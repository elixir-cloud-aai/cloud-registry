apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-registry.mongodbFullname" . }}
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "mongodb") | nindent 4 }}
spec:
  # Longer than the startup window (see `startupProbe`)
  progressDeadlineSeconds: 2400
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      {{- include "cloud-registry.selectorLabels" (dict "root" . "component" "mongodb") | nindent 6 }}
  # The data volume can only be used by one pod at a time
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "cloud-registry.selectorLabels" (dict "root" . "component" "mongodb") | nindent 8 }}
    spec:
      containers:
      - image: {{ .Values.mongodb.image }}
        imagePullPolicy: Always
        name: mongodb
        {{- if .Values.mongodb.auth.enabled }}
        env:
        {{- include "cloud-registry.mongodbSecretEnv" (dict "root" . "vars" (dict
          "MONGO_INITDB_ROOT_USERNAME" "root-username"
          "MONGO_INITDB_ROOT_PASSWORD" "root-password"
          "MONGO_APP_USERNAME" "username"
          "MONGO_APP_PASSWORD" "password"
        )) | trim | nindent 8 }}
        {{- end }}
        # TCP checks are cheaper than starting `mongosh` within the CPU limit.
        # MongoDB listens on localhost only while initializing an empty data
        # directory, and recovery after an unclean shutdown can take a while,
        # so allow up to 30 minutes before liveness checks start, as
        # interrupting the initialization skips it on the next start
        startupProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 10
          failureThreshold: 180
        readinessProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 20
        ports:
        - name: mongodb
          containerPort: 27017
          protocol: TCP
        resources: {{- toYaml .Values.mongodb.resources | nindent 10 }}
        securityContext:
          {{- include "cloud-registry.securityContext" (dict "root" . "context" .Values.mongodb.securityContext) | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/db
          name: mongodb
        # Writable, as the root file system is read-only by default: the
        # socket and the files of the entrypoint's first start (`/tmp`) and
        # the config database directory declared by the image
        - mountPath: /tmp
          name: tmp
        - mountPath: /data/configdb
          name: configdb
        {{- if .Values.mongodb.auth.enabled }}
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        {{- include "cloud-registry.securityContext" (dict "root" . "context" .Values.mongodb.podSecurityContext) | nindent 8 }}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: mongodb
        persistentVolumeClaim:
          claimName: {{ include "cloud-registry.mongodbFullname" . }}
      - name: tmp
        emptyDir: {}
      - name: configdb
        emptyDir: {}
      {{- if .Values.mongodb.auth.enabled }}
      - name: init-script
        configMap:
          name: {{ include "cloud-registry.mongodbFullname" . }}-init-script
      {{- end }}
