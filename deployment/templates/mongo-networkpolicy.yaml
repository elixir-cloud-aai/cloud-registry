{{ if .Values.mongodb.networkPolicy.enabled }}
{{- /*
Only the app's pods of this release may connect to MongoDB; connections from
the pod's node (the kubelet's probes) are always allowed. Egress is not
restricted.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-registry.mongodbFullname" . | quote }}
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "mongodb") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloud-registry.selectorLabels" (dict "root" . "component" "mongodb") | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "cloud-registry.selectorLabels" (dict "root" . "component" "app") | nindent 10 }}
    ports:
    - port: 27017
      protocol: TCP
{{ end }}
