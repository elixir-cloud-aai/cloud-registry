apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.cloud_registry.appName }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Values.cloud_registry.appName }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        # Roll the pods when the config changes
        checksum/config: {{ include (print $.Template.BasePath "/cloud-registry-configmap.yaml") . | sha256sum }}
      labels:
        app: {{ .Values.cloud_registry.appName }}
    spec:
      containers:
      - image: {{ .Values.cloud_registry.image }}
        imagePullPolicy: Always
        name: {{ .Values.cloud_registry.appName }}
        env:
        - name: FOCA_CONFIG_OVERLAY
          value: /etc/cloud-registry/overlay.yaml
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {{- toYaml .Values.cloud_registry.resources | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/cloud-registry
          name: config
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          name: {{ .Values.cloud_registry.appName }}-config
        name: config
