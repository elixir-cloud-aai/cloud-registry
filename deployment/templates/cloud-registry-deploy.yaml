apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-registry.fullname" . | quote }}
  labels:
    {{- include "cloud-registry.labels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      {{- include "cloud-registry.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        # Roll the pods when the config changes
        checksum/config: {{ include (print $.Template.BasePath "/cloud-registry-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "cloud-registry.selectorLabels" (dict "root" . "component" "app") | nindent 8 }}
    spec:
      containers:
      - image: {{ include "cloud-registry.image" . | quote }}
        imagePullPolicy: Always
        name: cloud-registry
        env:
        - name: FOCA_CONFIG_OVERLAY
          value: /etc/cloud-registry/overlay.yaml
        {{- if .Values.mongodb.auth.enabled }}
        {{- include "cloud-registry.mongodbSecretEnv" (dict "root" . "vars" (dict
          "MONGO_USERNAME" "username"
          "MONGO_PASSWORD" "password"
        )) | trim | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # Probes request `cloud_registry.probePath`, by default the Swagger UI
        # (no authentication, no database access)
        # Up to 5 minutes are allowed for the start before liveness checks
        startupProbe:
          httpGet:
            path: {{ .Values.cloud_registry.probePath | quote }}
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: {{ .Values.cloud_registry.probePath | quote }}
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: {{ .Values.cloud_registry.probePath | quote }}
            port: 8080
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources: {{- toYaml .Values.cloud_registry.resources | nindent 10 }}
        securityContext:
          {{- include "cloud-registry.securityContext" (dict "root" . "context" .Values.cloud_registry.securityContext) | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/cloud-registry
          name: config
          readOnly: true
        # Writable, as the root file system is read-only by default (e.g., for
        # temporary files of uploads), up to `cloud_registry.tmpSizeLimit`
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        {{- include "cloud-registry.securityContext" (dict "root" . "context" .Values.cloud_registry.podSecurityContext) | nindent 8 }}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          name: {{ printf "%s-config" (include "cloud-registry.fullname" .) | quote }}
        name: config
      - name: tmp
        {{- include "cloud-registry.emptyDir" .Values.cloud_registry.tmpSizeLimit | nindent 8 }}
