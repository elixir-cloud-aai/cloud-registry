# Default values for cloud-registry.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Resource names are derived from the release name: `<release>-cloud-registry`
# (or `<release>` if it contains `cloud-registry`) for the app and
# `<that name>-mongodb` for MongoDB; `nameOverride` replaces the chart name,
# `fullnameOverride` the derived app name (camelCase, as in other Helm
# charts). Set them at installation only: changing them later changes the
# pod selectors, which cannot be upgraded
nameOverride: ""
fullnameOverride: ""

# Public host name of the app; sets `custom.endpoints.service.external_host`
# in the app config, with URL scheme `https` and port 443 (override them via
# `config.custom.endpoints.service`)
host_name: ""

# App config overriding the base config in the image (`cloud_registry/config.yaml`
# of the image's version); mappings are merged recursively, other values
# (including lists) are replaced. Stored in a ConfigMap, so must not contain
# secrets. Deployments must set `security.auth.audience` (rendering fails
# without it, unless `security.auth.verify_audience` is false) and map an
# admin group to the role `admin` (rendering fails without one, unless
# `custom.access_control.require_admin` is false). Examples:
config: {}
#   security:
#     auth:
#       # Client IDs of the apps calling the registry
#       audience: ["my-portal-client-id"]
#     access_control:
#       # Members of this group may manage all services
#       group_mapping:
#         "urn:geant:lifescience-ri.eu:group:elixir:ECP_CLN:ADMIN#aai.lifescience-ri.eu": admin
#   log:
#     handlers:
#       console:
#         level: 20
#   custom:
#     endpoints:
#       # Service info (GA4GH `Service` schema, checked on startup); the
#       # version defaults to the app version
#       service_info:
#         organization:
#           name: "My organization"
#           url: "https://example.org"
#         environment: "prod"

cloud_registry:
  # Image repository; may include a tag or digest instead of setting `tag`
  # (e.g., `elixircloud/cloud-registry:0.3.0`)
  image: elixircloud/cloud-registry
  # Image tag; defaults to the chart's `appVersion`, i.e., the release
  # version for released charts and `dev` for the chart in the repository.
  # Images of commits on `dev` are tagged `sha-<commit>` (see
  # deployment/README.md, Image)
  tag: ""
  # Path of the app's startup, readiness and liveness probes; change it if
  # the config disables the Swagger UI
  probePath: /ga4gh/registry/v1/ui/
  # Ingress for `host_name`; if disabled, an OpenShift Route is created
  # instead, if the cluster serves Routes (see deployment/README.md, Ingress)
  ingress:
    enabled: true
    # Ingress class (`spec.ingressClassName`); the cluster's default class if
    # empty
    className: ""
    # Annotations of the Ingress, e.g., for the ingress controller; they take
    # precedence over those set by the chart: for `https`, and
    # `nginx.ingress.kubernetes.io/proxy-body-size`, the size limit of request
    # bodies of the app (`config.custom.max_content_length`) for
    # ingress-nginx. `null` removes an annotation set by the chart
    annotations: {}
    https:
      # Request a certificate from cert-manager (via `issuer`, a
      # ClusterIssuer) and serve HTTPS
      enabled: false
      issuer: letsencrypt-prod
  # Security contexts of the pod and the container; the image runs as user
  # 1000, and with a read-only root file system, temporary files go to an
  # `emptyDir` at `/tmp`. On OpenShift, `runAsUser`, `runAsGroup` and
  # `fsGroup` are omitted, as OpenShift assigns them
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Size limit of the `emptyDir` at `/tmp` (the pod is evicted if it is
  # exceeded): a quantity (e.g., `64Mi`) or a number of bytes; `null` for none
  tmpSizeLimit: 64Mi
  # Seconds that the app keeps serving after its pod is deleted, before it
  # shuts down (`preStop` hook), so that the ingress controller and Service
  # stop sending requests to it first; 0: no delay (no hook)
  preStopSleepSeconds: 5
  # Gunicorn, the image's WSGI server (passed via `GUNICORN_CMD_ARGS`; see
  # deployment/README.md, Server). Each worker loads the whole app (about
  # 55Mi), so raise the memory in `resources` before raising `workers`
  gunicorn:
    # Worker processes, and threads per worker (requests served at once)
    workers: 1
    threads: 4
    # Seconds after which workers whose main loop does not respond are
    # restarted (requests run in threads, so slow requests don't count)
    timeout: 30
    # Seconds that workers get to finish requests on shutdown (after
    # `preStopSleepSeconds`); the pod's termination grace period is both
    # plus 10 seconds
    gracefulTimeout: 20
    # Seconds after which idle keep-alive connections are closed (0: no
    # keep-alive); keep it longer than the upstream keep-alive timeout of the
    # ingress controller (60 seconds for ingress-nginx), which would otherwise
    # reuse connections as they are closed (failing requests with `502`)
    keepalive: 75
    # Further Gunicorn options, e.g., `["--access-logfile", "-"]` for an
    # access log (the app logs each request already); rendering fails for
    # `--bind`/`-b` (the chart's ports are 8080), `--preload` (MongoDB clients
    # must be created after forking) and `--graceful-timeout` (set
    # `gracefulTimeout`)
    extraArgs: []

mongodb:
  # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13
  # (https://jira.mongodb.org/browse/SERVER-121912); see the deployment docs
  # before changing the version of an existing database, e.g., when upgrading
  # from the legacy chart version 2 (`mongo:noble`)
  # Pinned to a minor version; patch versions are updated on restarts
  image: docker.io/library/mongo:7.0
  auth:
    # Require credentials (set `existingSecret`); enforced on every start,
    # but users are only created when MongoDB starts with an empty data
    # directory, so create them first for existing databases (see the
    # deployment docs). Without authentication, any pod that can reach the
    # MongoDB service can read and modify the data, so disable it explicitly
    # only if that is acceptable
    enabled: true
    # Name of an existing Secret with keys `root-username` and
    # `root-password` (MongoDB root user) and `username` and `password` (app
    # user, created with access to the app's database)
    existingSecret: ""
  volumeSize: 1Gi
  # Security contexts of the pod and the container; the image starts as root
  # and switches to user `mongodb` (999), so the user is set here, and
  # `fsGroup` makes the data volume writable for it. On OpenShift,
  # `runAsUser`, `runAsGroup` and `fsGroup` are omitted, as OpenShift assigns
  # them
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
  # Size limit of the `emptyDir` at `/tmp` (the pod is evicted if it is
  # exceeded): a quantity (e.g., `64Mi`) or a number of bytes; `null` for none
  tmpSizeLimit: 64Mi
