# Default values for cloud-registry.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Public host name of the app; sets `custom.endpoints.service.external_host`
# in the app config, with URL scheme `https` and port 443 (override them via
# `config.custom.endpoints.service`)
host_name: ""

# App config overriding the base config in the image (`cloud_registry/config.yaml`
# of the image's version); mappings are merged recursively, other values
# (including lists) are replaced. Stored in a ConfigMap, so must not contain
# secrets. Deployments must set `security.auth.audience` and map an admin
# group to the role `admin` (rendering fails without one, unless
# `custom.access_control.require_admin` is false). Examples:
config: {}
#   security:
#     auth:
#       # Client IDs of the apps calling the registry
#       audience: ["my-portal-client-id"]
#     access_control:
#       # Members of this group may manage all services
#       group_mapping:
#         "urn:geant:lifescience-ri.eu:group:elixir:ECP_CLN:ADMIN#aai.lifescience-ri.eu": admin
#   log:
#     handlers:
#       console:
#         level: 20
#   custom:
#     endpoints:
#       # Service info (GA4GH `Service` schema, checked on startup); the
#       # version defaults to the app version
#       service_info:
#         organization:
#           name: "My organization"
#           url: "https://example.org"
#         environment: "prod"

cloud_registry:
  # Image repository; may include a tag or digest instead of setting `tag`
  # (e.g., `elixircloud/cloud-registry:0.3.0`)
  image: elixircloud/cloud-registry
  # Image tag; defaults to the chart's `appVersion`, i.e., the release
  # version for released charts and `dev` for the chart in the repository.
  # Images of commits on `dev` are tagged `sha-<commit>` (see
  # deployment/README.md, Image)
  tag: ""
  appName: cloud-registry
  # Path of the app's startup, readiness and liveness probes; change it if
  # the config disables the Swagger UI
  probePath: /ga4gh/registry/v1/ui/
  # if ingress.enabled: false, it will deploy an OpenShift Route (https://docs.redhat.com/en/documentation/openshift_container_platform/4.19/html/network_apis/route-route-openshift-io-v1)
  ingress:
    enabled: true
    https:
      enabled: false
      issuer: letsencrypt-prod
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

mongodb:
  # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13
  # (https://jira.mongodb.org/browse/SERVER-121912); see the deployment docs
  # before changing the version of an existing database, e.g., when upgrading
  # from chart version 2 (`mongo:noble`)
  # Pinned to a minor version; patch versions are updated on restarts
  image: docker.io/library/mongo:7.0
  auth:
    # Require credentials (set `existingSecret`); enforced on every start,
    # but users are only created when MongoDB starts with an empty data
    # directory, so create them first for existing databases (see the
    # deployment docs). Without authentication, any pod that can reach the
    # MongoDB service can read and modify the data, so disable it explicitly
    # only if that is acceptable
    enabled: true
    # Name of an existing Secret with keys `root-username` and
    # `root-password` (MongoDB root user) and `username` and `password` (app
    # user, created with access to the app's database)
    existingSecret: ""
  volumeSize: 1Gi
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
