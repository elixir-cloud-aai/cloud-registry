# Values for rendering the chart in CI
hostName: registry.example.org
mongodb:
  auth:
    existingSecret: mongodb
config:
  security:
    auth:
      issuers: ["https://login.example.org/oidc/"]
      audience: ["test-client"]
      verify_audience: True
    access_control:
      claim_groups: groups
      group_mapping:
        test-admins: admin
